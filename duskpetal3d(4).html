/* --- the cache prompt ---------------------------------------------------------------
   In the isometric build this was a world-space label over the chest. Third
   person needs it on the HUD, or standing on a cache reads as nothing happening. */
function drawInteractPrompt() {
  if (Game.state !== STATE.PLAY || Game.paused) return;
  let near = null;
  for (const c of chests) {
    if (c.opened || !c.near) continue;
    near = c; break;
  }
  if (!near) return;
  const afford = Player.silver >= near.cost;
  const y = VH - 132;
  ctx.fillStyle = 'rgba(13,11,22,0.72)';
  ctx.fillRect(VW / 2 - 150, y - 17, 300, 34);
  ctx.strokeStyle = hexA(afford ? PAL.bloom : PAL.bone, 0.3);
  ctx.lineWidth = 1;
  ctx.strokeRect(VW / 2 - 150, y - 17, 300, 34);
  txtL(afford ? '[E]  OPEN SEED CACHE  —  ' + near.cost
              : 'NEEDS ' + near.cost + ' SILVER  (YOU HAVE ' + Player.silver + ')',
       VW / 2, y + 4, 12, afford ? PAL.bloom : hexA(PAL.bone, 0.55), 'center', 3);
}

/* --- world-space floating text -----------------------------------------------------
   The isometric build draws these into the world. Third person has no world
   canvas to draw on, so they are projected onto the overlay instead — without
   this, damage numbers, "+35", and "BALMBLOOM OPENS" simply never appeared. */
function drawFloaters3D() {
  for (const f of floaters) {
    const s = projectToScreen(f.wx, 1.6, f.wy);
    if (!s || s[2] > 40) continue;
    const t = clamp(f.life / f.maxLife, 0, 1);
    const scale = clamp(20 / (1 + s[2] * 0.35), 0.45, 1.15);
    ctx.globalAlpha = clamp(t * 1.6, 0, 1);
    label2(s[0], s[1] - (1 - t) * 26, f.text, f.color, Math.max(9, f.size * scale));
    ctx.globalAlpha = 1;
  }
}

/* --- standing in a beacon ring ------------------------------------------------------
   Says the name, the promise, and the exact numbers while you hold it, so the
   first time you ever stand in a ring you learn what it is for. */
function drawBeaconPrompt() {
  if (Game.state !== STATE.PLAY || Game.paused) return;
  let f = null;
  for (const x of flowers) { if (!x.bloomed && x.inRadius) { f = x; break; } }
  if (!f) return;
  const T = FLOWER_TYPES[f.type];
  const lines = flowerLines(f.type);
  const w = 340, h = 86, x = VW / 2 - w / 2, y = VH - 236;

  vinePanel(x, y, w, h, 0.82, T.petal);
  txtL('HOLD  ' + T.name, VW / 2, y + 24, 14, T.petal, 'center', 3);
  txtL(T.effect, VW / 2, y + 40, 9, hexA(T.petal, 0.7), 'center', 2);
  for (let i = 0; i < lines.length; i++) {
    txt(lines[i], VW / 2 - w / 2 + 24, y + 60 + i * 14, 10, hexA(PAL.bone, 0.8), 'left', 500);
  }
  /* the hold bar */
  const bw = w - 48, bx = x + 24, by = y + h - 9;
  ctx.fillStyle = 'rgba(13,11,22,0.7)';
  ctx.fillRect(bx, by, bw, 4);
  ctx.fillStyle = hexA(T.petal, 0.95);
  ctx.fillRect(bx, by, bw * clamp(f.progress, 0, 1), 4);
}

/* --- the controls legend, which fades on its own -------------------------------- */
function drawLegend() {
  if (legendTimer <= 0 || Game.state !== STATE.PLAY) return;
  const a = clamp(legendTimer / 2.5, 0, 1);
  const lines = [
    ['WASD', 'move'],
    ['MOUSE', isHighAngle() ? 'aim' : 'look'],
    ['HOLD CLICK', 'fire'],

    txt(lines[i][1], x - 84, y, 11, hexA(PAL.bone, 0.5 * a), 'left', 400);

         hexA(PAL.bone, 0.34 * a), 'right', 2);

}

/* --- title card ------------------------------------------------------------------
   A live 3D plateau is already turning behind this, so the card stays sparse:

function drawTitle3D() {

/* --- the boss wilt bar -----------------------------------------------------------
   Third person has no room for a bar floating over the flower itself, so it goes
   where a boss bar belongs: across the top, under the clock. */
function drawBossBar() {
  const Bs = Boss;
  if (Bs.dead || (!Bs.active && Bs.charge <= 0.01)) return;

  const w = Math.min(520, VW * 0.42), x = VW / 2 - w / 2, y = 104;

  if (!Bs.active) {
    /* the charge-up: a petal-unfurl fill, and a warning that says what it means */
    ctx.fillStyle = 'rgba(13,11,22,0.55)';
    ctx.fillRect(x, y, w, 6);
    ctx.fillStyle = hexA(PAL.accent, 0.85);
    ctx.fillRect(x, y, w * Bs.charge, 6);
    txtL('FORCING IT OPEN', VW / 2, y - 8, 11, hexA(PAL.accent, 0.95), 'center', 3);
    txtL('BACK OUT OF THE RING TO STOP', VW / 2, y + 20, 9, hexA(PAL.bone, 0.4), 'center', 2);
    return;
  }

  const frac = clamp(Bs.hp / Bs.maxHp, 0, 1);
  ctx.fillStyle = 'rgba(13,11,22,0.72)';
  ctx.fillRect(x - 3, y - 3, w + 6, 16);
  ctx.fillStyle = 'rgba(10,40,48,0.85)';
  ctx.fillRect(x, y, w, 10);
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, '#0FA8BE'); g.addColorStop(1, PAL.accent);
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w * frac, 10);
  ctx.strokeStyle = hexA(PAL.accent, 0.45); ctx.lineWidth = 1;
  ctx.strokeRect(x - 3, y - 3, w + 6, 16);

  /* the wilt notches — this is a flower being forced shut, not an HP bar */
  ctx.strokeStyle = hexA(PAL.ink, 0.55); ctx.lineWidth = 1.5;
  for (let i = 1; i < 6; i++) {
    const nx = x + (w * i) / 6;
    ctx.beginPath(); ctx.moveTo(nx, y); ctx.lineTo(nx, y + 10); ctx.stroke();
  }
  txtL(Bs.enraged ? 'BOSS BLOOM — IT REFUSES TO WILT' : 'BOSS BLOOM',
       VW / 2, y - 8, 11, hexA(PAL.accent, 0.95), 'center', 3);
}
/* ============================================================================
   BOOT AND LOOP — 3D build
   ========================================================================== */

let glCv = null;
let last3 = 0, fpsAccum3 = 0, fpsCount3 = 0;
const Proj = m4(), View = m4();

let renderScale = CONFIG3D.RENDER_SCALE;
function resize3D() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = glCv.clientWidth || window.innerWidth;
  const h = glCv.clientHeight || window.innerHeight;
  /* the scene buffer may be smaller than the window; CSS stretches it back up.
     The HUD canvas always stays at full resolution so text remains crisp. */
  glCv.width = Math.max(320, Math.round(w * dpr * renderScale));
  glCv.height = Math.max(180, Math.round(h * dpr * renderScale));
  gl.viewport(0, 0, glCv.width, glCv.height);
  resizeHud();
}

/* step the scene resolution to hold a playable frame rate */
let adaptAccum = 0, adaptFrames = 0, adaptWorst = 0;
function adaptResolution(dt) {
  if (!CONFIG3D.ADAPTIVE) return;
  adaptAccum += dt; adaptFrames++;
  adaptWorst = Math.max(adaptWorst, dt * 1000);
  if (adaptAccum < 1.0) return;
  const avgMs = (adaptAccum / adaptFrames) * 1000;
  adaptAccum = 0; adaptFrames = 0; adaptWorst = 0;
  let next = renderScale;
  if (avgMs > CONFIG3D.ADAPTIVE_TARGET_MS) next = Math.max(CONFIG3D.ADAPTIVE_MIN, renderScale - 0.12);
  else if (avgMs < CONFIG3D.ADAPTIVE_GOOD_MS) next = Math.min(1.0, renderScale + 0.06);
  if (Math.abs(next - renderScale) > 0.005) { renderScale = next; resize3D(); }
}

function pickSeed3D() {
  try {
    const m = /[?&]seed=(\d+)/.exec(window.location.search);
    if (m) return parseInt(m[1], 10) >>> 0;
  } catch (e) { /* file:// with no query string — fine */ }
  return (Math.random() * 0xFFFFFFFF) >>> 0;
}

let forcedSeed3 = null;
function startRun3D() {
  generateRun(forcedSeed3 !== null ? forcedSeed3 : pickSeed3D());
  chestsOpened = 0;
  econAccum = 0;
  Game.state = STATE.PLAY;
  Game.paused = false;
  legendTimer = CONFIG3D.LEGEND_SECONDS;
  buildGround();
  /* face the boss at the start: the threat should be the first thing you see */
  Cam3.yaw = Math.atan2(Boss.wx - Player.wx, Boss.wy - Player.wy);
  Cam3.pitch = -0.20;
  Cam3.x = Player.wx - Math.sin(Cam3.yaw) * CONFIG3D.CAM_DIST;
  Cam3.z = Player.wy - Math.cos(Cam3.yaw) * CONFIG3D.CAM_DIST;
  Cam3.y = CONFIG3D.PLAYER_EYE + CONFIG3D.CAM_HEIGHT;
  Audio_.init();
}

function frame3D(now) {
  requestAnimationFrame(frame3D);
  if (!last3) last3 = now;
  let dt = (now - last3) / 1000;
  last3 = now;
  if (dt > 0.1) dt = 0.1;

  fpsAccum3 += dt; fpsCount3++;
  if (fpsAccum3 >= 0.5) { fpsDisplay = fpsCount3 / fpsAccum3; fpsAccum3 = 0; fpsCount3 = 0; }

  if (legendTimer > 0 && !Game.paused) legendTimer -= dt;
  adaptResolution(dt);
  if (hitstop > 0) { hitstop -= dt; dt *= 0.12; }
  updateShake(dt);

  if (Game.state === STATE.PLAY && !Game.paused) {
    updateCamera3D(dt);
    buildIntent3D();
    updateGame(dt);
  } else if (Game.state === STATE.PLAY && Game.paused) {
    Game.intent = null;          // the world holds still while paused
  } else {
    Game.intent = null;
    updateParticles(dt);
    updateFloaters(dt);
    if (Portal.exists) Portal.anim = Math.min(1, Portal.anim + dt);
    updateCamera3D(dt);
  }

  draw3D();
  renderHud();
  Look.clearFrame();
}

function draw3D() {
  const aspect = glCv.width / Math.max(1, glCv.height);
  m4perspective(Proj, camFov(), aspect, 0.1, CONFIG3D.FAR);

  /* Look along the camera's own forward axis. Screen centre is therefore the
     aim point, and shake is a small nudge of that axis rather than of a target
     pinned to the player. */
  const sx = shakeX * CONFIG3D.SHAKE_SCALE, sy = shakeY * CONFIG3D.SHAKE_SCALE;
  const F = Cam3.fwd, R = Cam3.right, U = Cam3.up, L = 12;
  m4lookAt(View,
    Cam3.x, Cam3.y, Cam3.z,
    Cam3.x + F[0]*L + R[0]*sx + U[0]*sy,
    Cam3.y + F[1]*L + R[1]*sx + U[1]*sy,
    Cam3.z + F[2]*L + R[2]*sx + U[2]*sy,
    0, 1, 0);
  m4mul(ViewProj, Proj, View);

  buildFrame();

  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  drawSky();

  /* --- pass 1: opaque, lit ------------------------------------------------ */
  gl.disable(gl.BLEND);
  gl.depthMask(true);
  gl.enable(gl.DEPTH_TEST);

  setSceneUniforms(P_GROUND, ViewProj, Cam3.x, Cam3.y, Cam3.z);
  updateGroundColors();
  gl.bindVertexArray(Ground.vao);
  gl.drawArrays(gl.TRIANGLES, 0, Ground.count);
  gl.bindVertexArray(null);

  setSceneUniforms(P_LIT, ViewProj, Cam3.x, Cam3.y, Cam3.z);
  for (const k in B) batchDraw(B[k]);

  /* --- pass 2: ground decals ---------------------------------------------- */
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  gl.useProgram(P_DECAL.prog);
  gl.uniformMatrix4fv(P_DECAL.u.uViewProj, false, ViewProj);
  batchDraw(D.quad);

  /* --- pass 3: additive light ---------------------------------------------- */
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  gl.useProgram(P_ADD.prog);
  gl.uniformMatrix4fv(P_ADD.u.uViewProj, false, ViewProj);
  batchDraw(A.beam);
  batchDraw(A.glow);

  gl.depthMask(true);
  gl.disable(gl.BLEND);
}

function boot3D() {
  glCv = document.getElementById('scene');
  gl = glCv.getContext('webgl2', { antialias: true, alpha: false });
  if (!gl) {
    document.getElementById('nogl').style.display = 'flex';
    return;
  }
  initHud(document.getElementById('hud'));
  initScene();
  bindInput3D(glCv);
  window.addEventListener('resize', resize3D);
  resize3D();

  /* Straight into the run — no title gate, no click-to-dismiss. The controls
     appear as a corner legend that fades on its own while you are already
     playing, and the first click quietly upgrades to pointer lock. */
  RNG = makeRng(pickSeed3D());
  startRun3D();

  requestAnimationFrame(frame3D);
}

/* headless harness hooks — identical surface to the 2D build */
window.DUSKPETAL = {
  CONFIG, CONFIG3D, Game, Player, Boss, Portal, World, STATE, Cam3, Look,
  get flowers() { return flowers; },
  get chests() { return chests; },
  get enemies() { return enemies; },
  get bolts() { return bolts; },
  get enemyBolts() { return enemyBolts; },
  generateRun, updateGame, bloomPercent, makeEnemy,
  startRun: startRun3D,
