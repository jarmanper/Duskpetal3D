<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Duskpetal 3D</title>
<meta name="description" content="Bloom the beacons. Kill the Boss Bloom. Sixty seconds before the light fades.">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#0D0B16;
    color:#8BE8A1;
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    touch-action:none;
  }
  #wrap { position:fixed; inset:0; }
  canvas { position:absolute; inset:0; display:block; width:100%; height:100%; }
  canvas#scene { z-index:1; }
  canvas#hud   { z-index:2; pointer-events:none; }
  #wrap.locked { cursor:none; }
  #nogl, #rot {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:#0D0B16; color:#8BE8A1; text-align:center; padding:24px; font-size:15px;
    letter-spacing:.06em; line-height:1.7; z-index:20;
  }
  @media (max-width: 900px) { #rot { display:flex; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="scene"></canvas>
  <canvas id="hud"></canvas>
</div>
<div id="nogl">This build needs WebGL 2.<br>Try a current Chrome, Edge, Firefox or Safari &mdash;<br>or use the isometric build, duskpetal.html.</div>
<div id="rot">DUSKPETAL 3D needs a keyboard and mouse.<br>Open it on a laptop or desktop.</div>
<script>
"use strict";
/* ============================================================================
   DUSKPETAL
   A 60-second reverse-siege: bloom the beacons, kill the Boss Bloom,
   leave through the portal before the light fades.

   ---------------------------------------------------------------------------
   TUNING BLOCK — every number worth changing during playtesting lives here.
   Nothing below this block hardcodes a balance value. Edit, save, reload.
   ---------------------------------------------------------------------------
   ========================================================================== */

const CONFIG = {

  /* --- RUN / PACING ------------------------------------------------------ */
  /* A STRICT sixty: the clock starts at 60 and the run is over at 0, full stop.
     The GDD's "darkness reclaims the ground you haven't bloomed" beat happens
     INSIDE that minute rather than after it — the light starts going with
     DUSK_WINDOW_SECONDS left, and for those last seconds unbloomed ground bites
     while bloomed ground holds. Set the window to 0 to end the run clean. */
  LIGHT_SECONDS:            60,   // clock the player races. The run ends at 0.
  DUSK_WINDOW_SECONDS:      8,    // the last N seconds are the reclaim
  DUSK_DPS:                 30,   // damage/sec on UNBLOOMED ground, ramped in
  DUSK_BLOOMED_DPS:         0,    // damage/sec on BLOOMED ground — this is why
                                  // blooming ground is worth doing at all
  TARGET_CLEAR_SECONDS:     45,   // design target for an expert route (readout only)

  /* --- MAP --------------------------------------------------------------- */
  MAP_W:                    42,   // tiles
  MAP_H:                    42,
  STRUCTURE_COUNT:          32,   // monoliths / ruin blocks
  STRUCTURE_MIN:            1,    // min footprint in tiles
  STRUCTURE_MAX:            3,    // max footprint in tiles
  SPAWN_CLEAR_RADIUS:       5.0,  // no structures/enemies this close to spawn

  /* --- CAMERA / RENDER --------------------------------------------------- */
  TILE_W:                   64,   // iso diamond width  (px at zoom 1)
  TILE_H:                   32,   // iso diamond height (px at zoom 1)
  ZOOM:                     0.92, // pulled back to macro-tactical
  ZOOM_REF_HEIGHT:          810,  // zoom scales with viewport height off this, so a
                                  // 1080p screen frames the same amount of ground as
                                  // a laptop instead of revealing the whole map
  CAMERA_LERP:              9.0,  // camera follow stiffness
  CAMERA_LOOKAHEAD:         1.6,  // tiles of lead toward the aim cursor

  /* --- PLAYER ------------------------------------------------------------ */
  PLAYER_SPEED:             7.6,  // tiles / sec
  PLAYER_MAX_HP:            100,
  PLAYER_RADIUS:            0.42,
  PLAYER_IFRAMES:           0.45, // sec of invulnerability after a hit

  /* --- WEAPON (seed-bolts) -----------------------------------------------
     Hold the left mouse button to fire; you aim with the cursor. Nothing is
     automatic — releasing the button stops the gun. */
  BOLT_DAMAGE:              13,
  BOLT_SPEED:               24,   // tiles / sec
  BOLT_COOLDOWN:            0.150,// sec between shots while the button is held
  BOLT_LIFE:                0.80, // sec  -> range ~19 tiles
  BOLT_PIERCE:              0,    // extra enemies a bolt passes through
  BOLT_RADIUS:              0.34,
  BOLT_MUZZLE_OFFSET:       0.12, // tiles ahead of the player the bolt starts.
                                  // Keep this small: a large offset made bolts
                                  // spawn PAST anything sitting on top of you.
  BOLT_STEP_MAX:            0.30, // tiles per collision sub-step. Bolts move
                                  // 0.4 tiles/frame, so without sub-stepping
                                  // they tunnel straight through small enemies.

  /* --- BEACON FLOWERS ----------------------------------------------------- */
  FLOWER_COUNT:             3,    // one of each type: economy, healing, buff
  FLOWER_HOLD_RADIUS:       2.8,  // tiles — stand inside to charge the bloom
  FLOWER_HOLD_SECONDS:      3.2,  // tiles of hold-time to bloom it
  // FRAGILE #1: leaving the radius. 0 = progress PAUSES (kite-friendly).
  // >= 1/FLOWER_HOLD_SECONDS = full reset by the time you cross the map.
  // Default is a slow bleed: you can dodge out for a beat, not run away.
  FLOWER_DECAY_PER_SEC:     0.34, // fraction of total progress lost per sec outside
  FLOWER_BLOOM_RADIUS:      14.0,  // tiles of terrain this flower lights permanently
  FLOWER_LIGHT_SPREAD:      7.0,  // tiles/sec the light front travels outward on bloom
  FLOWER_MIN_SEPARATION:    15.0, // tiles — keeps flowers from clustering
  FLOWER_MIN_DIST_SPAWN:    7.0,
  // FRAGILE #3: guaranteed placement instead of pure random. The healing flower
  // is forced into a band near the spawn->boss corridor so a bad roll can't
  // strand it behind you.
  HEAL_CORRIDOR_MAX_OFFSET: 11.0, // tiles of perpendicular offset from that corridor

  /* --- FLOWER EFFECTS ----------------------------------------------------- */
  ECON_PASSIVE_PER_SEC:     1.4,  // silver dollars/sec once Coinpetal is lit
  ECON_DROP_MULT:           1.6,  // enemy drop multiplier once lit
  HEAL_INSTANT:             35,   // HP restored the moment Balmbloom opens
  HEAL_REGEN_PER_SEC:       3.0,  // HP/sec afterwards
  BUFF_DAMAGE_MULT:         1.35, // Ironvine
  BUFF_FIRERATE_MULT:       1.18,

  /* --- DIFFICULTY RAMP ------------------------------------------------------
     The plateau does NOT start full. A handful of enemies sit out in the dark at
     the start, and pressure is added in waves that grow as the run goes on, so
     the first fifteen seconds teach one enemy at a time.
     Kinds unlock on a clock: rusher immediately, spitter next, swarm last.
     -------------------------------------------------------------------------- */
  START_RUSHERS:            3,    // pre-placed at run start. That is all.
  START_SPITTERS:           1,
  START_MIN_DIST_SPAWN:     14.0, // nothing is waiting on top of you
  BOSS_GUARD_COUNT:         3,    // sits by the boss; punishes a cold rush

  WAVE_FIRST_AT:            6.5,  // sec of quiet before anything is sent
  WAVE_INTERVAL:            6.5,  // sec between waves at the start of the run
  WAVE_INTERVAL_MIN:        3.4,  // floor once the run is old
  WAVE_INTERVAL_DECAY:      0.045,// sec shaved off the interval per sec elapsed
  WAVE_SIZE_BASE:           1,    // enemies per wave at t=0
  WAVE_SIZE_PER_SEC:        0.060,// extra enemies per wave per sec elapsed
  WAVE_SIZE_MAX:            5,
  ENEMY_CAP_BASE:           6,    // hard cap on live enemies at t=0
  ENEMY_CAP_PER_SEC:        0.32, // cap growth per sec elapsed
  ENEMY_CAP_MAX:            22,
  SPITTER_UNLOCK_AT:        11.0, // sec — waves can include spitters from here
  MITE_UNLOCK_AT:           22.0, // sec — swarms arrive last, once you can shoot
  SPAWN_MIN_DIST_PLAYER:    13.0, // waves always arrive from out in the dark
  SPAWN_MAX_DIST_PLAYER:    24.0,
  ENEMY_AGGRO_RANGE:        12.0, // tiles

  /* --- ENEMIES ------------------------------------------------------------ */
  /* Every speed here is below PLAYER_SPEED: you can always disengage on foot. */
  RUSHER_HP:                30,  RUSHER_SPEED: 4.9, RUSHER_DAMAGE: 11, RUSHER_RADIUS: 0.52,
  RUSHER_LUNGE_RANGE:       4.6, RUSHER_LUNGE_MULT: 1.9, RUSHER_LUNGE_TIME: 0.40,
  RUSHER_LUNGE_TELEGRAPH:   0.32, // sec of visible wind-up before it commits
  RUSHER_DROP:              3,

  SPITTER_HP:               24,  SPITTER_SPEED: 2.8, SPITTER_RADIUS: 0.50,
  SPITTER_RANGE:            9.5, SPITTER_KEEP_DIST: 7.0,
  SPITTER_SHOT_COOLDOWN:    1.75, SPITTER_SHOT_DAMAGE: 8, SPITTER_SHOT_SPEED: 10,
  SPITTER_DROP:             4,

  /* Mites dart in, land one hit, then peel off. They never sit on top of you —
     that was the bug where a swarm latched on and could not be shot free. */
  MITE_HP:                  8,   MITE_SPEED: 5.6, MITE_DAMAGE: 4, MITE_RADIUS: 0.34,
  MITE_ORBIT_JITTER:        1.6,
  MITE_STANDOFF:            1.25, // tiles it holds while circling, before a dart
  MITE_DART_COOLDOWN:       1.5,  // sec between dive attempts
  MITE_RETREAT_TIME:        1.1,  // sec it backs off after connecting or being hit
  MITE_RETREAT_MULT:        1.15,
  MITE_PER_CLUSTER:         3,    // a mite wave sends this many at once
  MITE_DROP:                1,

  /* --- CHESTS (Seed Caches) ----------------------------------------------- */
  CHEST_COUNT:              3,
  CHEST_COST:               12,   // silver dollars
  CHEST_COST_ESCALATION:    7,    // each chest opened raises the next one's price
  CHEST_INTERACT_RADIUS:    1.9,
  CHEST_MIN_SEPARATION:     11.0,

  /* --- BOSS BLOOM ----------------------------------------------------------
     The run's difficulty lives HERE, not in how crowded the map is. Going in
     cold has to fail; going in with beacons lit has to work. These damage
     numbers are what separates those two outcomes — raise them to punish the
     cold rush harder, lower them if prepared players are dying too. */
  BOSS_HP:                  1150,
  BOSS_RADIUS:              1.9,
  BOSS_TRIGGER_RADIUS:      6.5,  // step inside to begin the charge-up
  BOSS_CHARGE_SECONDS:      3.0,  // FRAGILE #2: the "you are committing" window
  BOSS_CHARGE_DECAY:        1.4,  // charge lost per sec if you back out (0 = it sticks)
  BOSS_MIN_DIST_SPAWN:      26.0, // reachable from turn one, but a real walk
  BOSS_CONTACT_DAMAGE:      26,

  BOSS_BARRAGE_COOLDOWN:    2.2,  // radial petal-shot
  BOSS_BARRAGE_PETALS:      11,
  BOSS_BARRAGE_SPEED:       8.0,
  BOSS_BARRAGE_DAMAGE:      17,

  BOSS_SWEEP_COOLDOWN:      5.4,  // rotating light-lash
  BOSS_SWEEP_WINDUP:        1.1,
  BOSS_SWEEP_DURATION:      2.2,
  BOSS_SWEEP_DAMAGE:        27,
  BOSS_SWEEP_ARC:           0.42, // radians of the lash
  BOSS_SWEEP_LENGTH:        11.0,

  BOSS_SEED_COOLDOWN:       7.5,  // spits mites
  BOSS_SEED_COUNT:          4,
  BOSS_ENRAGE_AT:           0.35, // hp fraction; cooldowns scale down below this
  BOSS_ENRAGE_MULT:         0.66,

  BOSS_BLOOM_RADIUS:        16.0, // ground its death floods with light

  /* --- PORTAL --------------------------------------------------------------- */
  PORTAL_BLOOM_SECONDS:     1.5,  // petals unfurling into existence
  PORTAL_RADIUS:            2.0,

  /* --- READABILITY ------------------------------------------------------------ */
  CARD_SECONDS:             5.0,  // how long an item / beacon card stays up
  /* The wilted beacon you spawn at. Its strength used to be 0.30, below the 0.42
     counting threshold, so the ground you start on lit up visually but counted
     for nothing and every run opened on a flat 0%. It now clears the threshold,
     so you start the run with a small foothold instead of nothing. */
  /* The GDD opens "in near-total darkness at a wilted, unlit beacon", and a tile
     only COUNTS as reclaimed once it is visibly lit (past 0.42). Those two pull
     against each other: brightness is the only currency the counter accepts.
     0.56 is the compromise — barely into the green, so the spawn still reads as
     a dying ember, but the centre clears the threshold so you open on ~1% rather
     than a flat 0%. Raise STRENGTH for a bigger foothold and a brighter spawn. */
  SPAWN_BLOOM_RADIUS:       6.5,
  SPAWN_BLOOM_STRENGTH:     0.56,

  /* --- FEEL ----------------------------------------------------------------- */
  SHAKE_HIT:                6,
  SHAKE_BLOOM:              9,
  SHAKE_BOSS_DEATH:         22,
  HITSTOP_ON_KILL:          0.045,
  PARTICLE_BUDGET:          520,

  /* --- DEBUG ---------------------------------------------------------------- */
  SHOW_SEED:                true,  // seed is printed in the HUD; ?seed=123 to replay a run
  SHOW_DEBUG:               false, // F1 in game
};

/* Palette. ACCENT is reserved: active beams, the Boss Bloom, portal activation.
   Never general UI. */
const PAL = {
  base:      '#1A162B',
  structure: '#271B2E',
  terrain:   '#122B17',
  bloom:     '#8BE8A1',
  accent:    '#00E5FF',
  ink:       '#0D0B16',
  bone:      '#C9D6CE',
  blood:     '#C4374F',
  /* Silver Dollars. Cold on purpose: the GDD's avoid-list rules out warm colour
     anywhere except the cyan accent, and gold read as a warm intruder. */
  silver:    '#B7C6D4',
};
/* ============================================================================
   3D TUNING BLOCK — camera, framing and scene scale.

   Everything about the GAME (timings, damage, waves, placement) still lives in
   the shared CONFIG above; this block only governs how it is filmed and built.
   One world unit = one tile of the simulation, so these numbers are in tiles.
   ========================================================================== */

const CONFIG3D = {

  /* --- camera modes ---------------------------------------------------------
     Two framings, swapped live with [C].

     'shoulder' is the Risk of Rain camera this build was asked for: pointer
     locked, mouse-look, reticle pinned to screen centre.

     'highangle' is the GDD's own framing — "high-angle top-down isometric,
     pulled back to macro-tactical scale, the player kept centered". Pitch and
     yaw are FIXED (a fixed yaw is what makes a shot isometric rather than
     merely steep), the camera sits far back and high, the player is dead centre,
     and the mouse goes back to being a free cursor that aims by raycasting
     through the screen onto the ground — the isometric build's read of the
     battlefield, in 3D. Pointer lock is released in this mode, because a locked
     cursor and a free one cannot both be true.

     The default stays 'shoulder'; the GDD framing is one keypress away rather
     than replacing a camera that was explicitly chosen. */
  CAMERA_MODE:        'shoulder',   // 'shoulder' | 'highangle'
  HIGH_PITCH:         -0.92,   // ~53° down — steep, but the plateau still has depth
  HIGH_YAW:            0.7854, // 45°, the isometric build's own compass
  HIGH_DIST:           30,     // macro-tactical pull-back, in tiles
  HIGH_FOV:            38,     // narrower than the shoulder FOV: less perspective
                               // divergence, so the read is closer to isometric
  HIGH_LERP:           9.0,    // a slower, more deliberate follow than shoulder

  /* --- camera ------------------------------------------------------------- */
  FOV:                 62,     // degrees, vertical
  FAR:                 220,
  CAM_DIST:            6.2,    // how far behind the player the camera sits
  CAM_HEIGHT:          1.75,   // lift above the player's eye line
  CAM_SHOULDER:        1.05,   // offset to the right — the over-the-shoulder look
  AIM_MAX_DIST:        44,     // how far out the reticle ray is allowed to land
  CAM_LERP:            13.0,   // follow stiffness
  PLAYER_EYE:          1.25,
  MOUSE_SENSITIVITY:   0.0022, // radians per pixel of mouse movement
  PITCH_MIN:          -0.62,   // looking down
  PITCH_MAX:           0.28,   // looking up — clamped so the reticle still
                               // reaches the ground plane
  SHAKE_SCALE:         0.012,  // screen shake, converted from the 2D build's pixels
  LEGEND_SECONDS:      9,      // how long the controls legend lingers before fading

  /* --- atmosphere ---------------------------------------------------------- */
  /* Fog is what sells the perpetual twilight AND hides the plateau edge. It is
     also the reason bloomed ground reads from a distance: lit ground beats the
     fog, unlit ground dissolves into it. */
  FOG_DENSITY:         0.0125,
  HORIZON_FILL:        0.045,  // how far the horizon band lifts toward bone
  RIM_STRENGTH:        0.055,  // the graphic edge line on every silhouette
  CULL_DIST:           78,     // props past this are skipped entirely

  /* --- scene scale ---------------------------------------------------------- */
  STRUCTURE_HEIGHT:    1.9,    // multiplier on the sim's structure height
  FLOWER_HEIGHT:       2.3,
  FLOWER_PETAL:        0.85,
  BOSS_HEIGHT:         5.2,
  BOSS_PETAL:          2.5,
  BEAM_HEIGHT:         34,     // distant beacons must cut through the dark
  BOLT_HEIGHT:         0.95,
  DECAL_HEIGHT:        0.035,  // lift decals off the ground to avoid z-fighting
  PIP_HEIGHT:          1.9,    // where enemy health pips float

  /* --- performance -----------------------------------------------------------
     The scene is rendered to a buffer that can be smaller than the window and
     stretched up. On a weak laptop — which is what a classroom playtest runs on
     — this is the difference between 25fps and 60fps, and at 0.7 it is barely
     noticeable on a stylized, flat-shaded scene. Set ADAPTIVE false to pin it. */
  RENDER_SCALE:        1.0,    // starting scale
  ADAPTIVE:            true,   // step the scale down when frames get expensive
  ADAPTIVE_MIN:        0.55,
  ADAPTIVE_TARGET_MS:  20,     // step down above this frame time
  ADAPTIVE_GOOD_MS:    12,     // step back up below this
  MAX_PARTICLE_GLOWS:  90,     // hard cap on additive particle quads per frame
  PARTICLE_CULL_DIST:  34,
  GLOW_CULL_DIST:      62,

  /* --- lighting ------------------------------------------------------------- */
  BEACON_LIGHT:        0.80,   // higher clips the bloom to white; the additive
                               // core glow supplies the hot centre instead
  BEACON_LIGHT_RANGE:  1.5,    // multiplier on FLOWER_BLOOM_RADIUS
  BOSS_LIGHT_RANGE:    30,
  LANTERN_LIGHT:       1.5,
  LANTERN_RANGE:       11,
};
/* ============================================================================
   UTIL — rng, math, iso projection, colour, particles
   ========================================================================== */

/* --- seeded rng (mulberry32) — every run is reproducible from its seed ----- */
let RNG = null;
function makeRng(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rnd      = () => RNG();
const rndR     = (a, b) => a + RNG() * (b - a);
const rndI     = (a, b) => Math.floor(a + RNG() * (b - a + 1));
const rndPick  = (arr) => arr[Math.floor(RNG() * arr.length)];
const rndSign  = () => (RNG() < 0.5 ? -1 : 1);

/* --- math ------------------------------------------------------------------ */
const TAU   = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const dist2 = (ax, ay, bx, by) => { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; };
const dist  = (ax, ay, bx, by) => Math.sqrt(dist2(ax, ay, bx, by));
const smooth = (t) => t * t * (3 - 2 * t);
const ease   = (t) => 1 - Math.pow(1 - t, 3);
function approach(cur, target, rate, dt) {
  return cur + (target - cur) * (1 - Math.exp(-rate * dt));
}
function normalize(x, y) {
  const m = Math.hypot(x, y);
  return m < 1e-6 ? [0, 0] : [x / m, y / m];
}
/* deterministic value hash for per-tile texture — no rng calls during render */
function hash2(x, y) {
  let h = (x * 374761393 + y * 668265263) | 0;
  h = (h ^ (h >>> 13)) | 0;
  h = Math.imul(h, 1274126177) | 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

/* --- isometric projection --------------------------------------------------- */
/* World space is flat tile units (wx, wy). Screen is the iso diamond.          */
let HW = CONFIG.TILE_W / 2, HH = CONFIG.TILE_H / 2;
function isoX(wx, wy) { return (wx - wy) * HW; }
function isoY(wx, wy) { return (wx + wy) * HH; }
function unIso(sx, sy) { return [(sx / HW + sy / HH) / 2, (sy / HH - sx / HW) / 2]; }
/* depth key — larger draws later (in front) */
function depth(wx, wy) { return wx + wy; }

/* --- colour ------------------------------------------------------------------ */
function hexToRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
const RGB = {
  base: hexToRgb(PAL.base), structure: hexToRgb(PAL.structure), terrain: hexToRgb(PAL.terrain),
  bloom: hexToRgb(PAL.bloom), accent: hexToRgb(PAL.accent), ink: hexToRgb(PAL.ink),
};
function mixRgb(a, b, t) {
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
}
function rgbStr(c) { return 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')'; }
function rgbaStr(c, a) { return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')'; }
function hexA(hex, a) { const c = hexToRgb(hex); return rgbaStr(c, a); }

/* --- particles ---------------------------------------------------------------- */
const particles = [];
function spawnParticle(wx, wy, vx, vy, life, size, color, glow, gravity) {
  if (particles.length >= CONFIG.PARTICLE_BUDGET) particles.shift();
  particles.push({
    wx, wy, vx, vy, life, maxLife: life, size,
    color: color || PAL.bloom, glow: glow !== false, g: gravity || 0, z: 0, vz: 0,
  });
}
function burst(wx, wy, n, opts) {
  const o = opts || {};
  for (let i = 0; i < n; i++) {
    const a = rndR(0, TAU), s = rndR(o.smin || 2, o.smax || 8);
    spawnParticle(
      wx, wy, Math.cos(a) * s, Math.sin(a) * s,
      rndR(o.lmin || 0.25, o.lmax || 0.6),
      rndR(o.zmin || 2, o.zmax || 5),
      o.color || PAL.bloom, o.glow !== false, o.g || 0
    );
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.wx += p.vx * dt; p.wy += p.vy * dt;
    p.vx *= Math.pow(0.12, dt); p.vy *= Math.pow(0.12, dt);
    if (p.g) { p.vz -= p.g * dt; p.z = Math.max(0, p.z + p.vz * dt); }
  }
}

/* --- floating text ------------------------------------------------------------ */
const floaters = [];
function floatText(wx, wy, text, color, size) {
  floaters.push({ wx, wy, text, color: color || PAL.bloom, size: size || 14, life: 1.0, maxLife: 1.0 });
}
function updateFloaters(dt) {
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.life -= dt; f.wy -= dt * 0.7;
    if (f.life <= 0) floaters.splice(i, 1);
  }
}

/* --- notice cards ---------------------------------------------------------------
   A symbol appearing in the corner told a new player nothing. Anything the run
   grants you — a cache item, a beacon opening — now pushes a card that names it
   and says in plain words what it does. Shared by both builds.
   -------------------------------------------------------------------------------- */
const cards = [];
function showCard(title, sub, lines, color, iconId, glyph) {
  /* one card at a time reads better than a stack; a new one replaces the old */
  cards.length = 0;
  cards.push({
    title, sub, lines: lines || [], color: color || PAL.bloom,
    iconId: iconId || null, glyph: glyph || null,
    life: CONFIG.CARD_SECONDS, maxLife: CONFIG.CARD_SECONDS,
  });
}
function updateCards(dt) {
  for (let i = cards.length - 1; i >= 0; i--) {
    cards[i].life -= dt;
    if (cards[i].life <= 0) cards.splice(i, 1);
  }
}

/* --- screen shake / hitstop ---------------------------------------------------- */
let shake = 0, shakeX = 0, shakeY = 0, hitstop = 0;
function addShake(v) { shake = Math.min(34, shake + v); }
function addHitstop(v) { hitstop = Math.max(hitstop, v); }
function updateShake(dt) {
  shake = approach(shake, 0, 7, dt);
  shakeX = rndR(-1, 1) * shake;
  shakeY = rndR(-1, 1) * shake * 0.6;
}

/* --- audio: tiny synth, no assets, file:// safe --------------------------------- */
const Audio_ = {
  ctx: null, muted: false, master: null,
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.30;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  },
  blip(freq, dur, type, vol, slide) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'triangle';
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, freq) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime, n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq || 900;
    const g = this.ctx.createGain(); g.gain.value = vol || 0.16;
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t);
  },
  shoot()   { this.blip(680, 0.06, 'square', 0.045, 0.55); },
  hit()     { this.blip(240, 0.07, 'square', 0.06, 0.7); },
  kill()    { this.noise(0.16, 0.13, 1400); this.blip(150, 0.14, 'sawtooth', 0.07, 0.4); },
  hurt()    { this.noise(0.24, 0.20, 500); this.blip(110, 0.20, 'sawtooth', 0.13, 0.5); },
  bloom()   { this.blip(392, 0.30, 'sine', 0.16, 2.0); this.blip(587, 0.42, 'sine', 0.11, 1.5); },
  pickup()  { this.blip(880, 0.09, 'sine', 0.10, 1.5); },
  coin()    { this.blip(1320, 0.045, 'sine', 0.035, 1.2); },
  chest()   { this.blip(523, 0.18, 'triangle', 0.14, 1.6); this.blip(784, 0.30, 'sine', 0.10, 1.4); },
  charge()  { this.blip(160, 0.5, 'sawtooth', 0.09, 3.2); },
  bossHurt(){ this.blip(90, 0.09, 'square', 0.05, 0.8); },
  bossDie() { this.noise(1.1, 0.30, 2600); this.blip(220, 1.3, 'sine', 0.20, 4.0); },
  portal()  { this.blip(660, 0.9, 'sine', 0.16, 2.2); this.blip(990, 1.1, 'sine', 0.10, 1.8); },
  win()     { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.blip(f, 0.5, 'sine', 0.16, 1.0), i * 130)); },
  lose()    { [330, 262, 196, 147].forEach((f, i) => setTimeout(() => this.blip(f, 0.6, 'triangle', 0.15, 0.8), i * 190)); },
};
/* ============================================================================
   WORLD — terrain, bloom state, structures, procedural placement
   ========================================================================== */

const World = {
  w: 0, h: 0,
  bloom: null,        // Float32Array — LAND BLOOM STATE. 0 = dark, 1 = fully bloomed.
  target: null,       // Float32Array — what each tile is climbing toward
  bloomedTiles: 0,    // running count of tiles past BLOOM_READ_THRESHOLD
  totalTiles: 0,
  structures: [],     // {x,y,w,h,ht,seed}  axis-aligned in tile space
  solid: null,        // Uint8Array — 1 where a structure blocks movement
  solidH: null,       // Float32Array — that structure's height, for 3D camera occlusion
  toneTerrain: 0,     // per-session palette lean (see randomizeTone)
  toneStructure: 0,
  ceiling: 1,          // the most of this map any run could light
};

const BLOOM_READ_THRESHOLD = 0.42; // a tile "counts as bloomed" past this

function worldInit() {
  World.w = CONFIG.MAP_W; World.h = CONFIG.MAP_H;
  World.totalTiles = World.w * World.h;
  World.bloom  = new Float32Array(World.totalTiles);
  World.target = new Float32Array(World.totalTiles);
  World.solid  = new Uint8Array(World.totalTiles);
  World.solidH = new Float32Array(World.totalTiles);
  World.structures.length = 0;
  World.bloomedTiles = 0;
  randomizeTone();
}

/* per-session: which palette tone dominates terrain vs structures */
function randomizeTone() {
  World.toneTerrain   = rndR(-0.10, 0.16); // + leans toward base violet, - toward deep green
  World.toneStructure = rndR(-0.12, 0.18);
}

const tIdx = (x, y) => y * World.w + x;
const inMap = (x, y) => x >= 0 && y >= 0 && x < World.w && y < World.h;

function bloomAt(wx, wy) {
  const x = Math.floor(wx), y = Math.floor(wy);
  if (!inMap(x, y)) return 0;
  return World.bloom[tIdx(x, y)];
}
function isSolid(wx, wy) {
  const x = Math.floor(wx), y = Math.floor(wy);
  if (!inMap(x, y)) return true;
  return World.solid[tIdx(x, y)] === 1;
}

/* ---- structures ------------------------------------------------------------ */
function generateStructures(spawnX, spawnY) {
  let attempts = 0;
  while (World.structures.length < CONFIG.STRUCTURE_COUNT && attempts < 900) {
    attempts++;
    /* a third of them are tall 1x1 monoliths; the rest squat ruin blocks */
    const isSpire = rnd() < 0.36;
    const w = isSpire ? 1 : rndI(CONFIG.STRUCTURE_MIN, CONFIG.STRUCTURE_MAX);
    const h = isSpire ? 1 : rndI(CONFIG.STRUCTURE_MIN, CONFIG.STRUCTURE_MAX);
    const x = rndI(2, World.w - w - 3);
    const y = rndI(2, World.h - h - 3);
    const cx = x + w / 2, cy = y + h / 2;
    if (dist(cx, cy, spawnX, spawnY) < CONFIG.SPAWN_CLEAR_RADIUS + 2) continue;
    // keep corridors open: reject if it touches an existing block
    let bad = false;
    for (const s of World.structures) {
      if (x < s.x + s.w + 2 && x + w + 2 > s.x && y < s.y + s.h + 2 && y + h + 2 > s.y) { bad = true; break; }
    }
    if (bad) continue;
    const seed = rnd();
    const st = {
      x, y, w, h, seed, spire: isSpire,
      ht: isSpire ? rndR(3.2, 6.2) : rndR(0.7, 2.2),
      broken: rnd() < 0.5,
    };
    World.structures.push(st);
    for (let iy = y; iy < y + h; iy++) for (let ix = x; ix < x + w; ix++) {
      World.solid[tIdx(ix, iy)] = 1;
      World.solidH[tIdx(ix, iy)] = st.ht;
    }
  }
}

/* ---- bloom propagation ------------------------------------------------------ */
/* A bloomed beacon paints a permanent target value into the tile field; the
   actual bloom value climbs toward it over time so you SEE the light travel. */
function paintBloom(cx, cy, radius, strength) {
  const x0 = Math.max(0, Math.floor(cx - radius)), x1 = Math.min(World.w - 1, Math.ceil(cx + radius));
  const y0 = Math.max(0, Math.floor(cy - radius)), y1 = Math.min(World.h - 1, Math.ceil(cy + radius));
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const d = dist(x + 0.5, y + 0.5, cx, cy);
      if (d > radius) continue;
      const v = (1 - d / radius);
      const val = clamp(smooth(v) * (strength || 1), 0, 1);
      const i = tIdx(x, y);
      if (val > World.target[i]) World.target[i] = val;
    }
  }
}

function updateBloomField(dt) {
  const b = World.bloom, t = World.target;
  const rate = CONFIG.FLOWER_LIGHT_SPREAD * 0.30;
  let count = 0, moved = false;
  for (let i = 0; i < b.length; i++) {
    if (b[i] < t[i]) {
      b[i] = Math.min(t[i], b[i] + rate * dt);
      moved = true;
    }
    if (b[i] >= BLOOM_READ_THRESHOLD) count++;
  }
  World.bloomedTiles = count;
  /* the 3D build rebuilds ground vertex colours only when this flips */
  if (moved && typeof Ground !== 'undefined' && Ground) Ground.dirty = true;
}

function bloomPercent() {
  return World.bloomedTiles / World.totalTiles;
}

/* The running count is maintained by updateBloomField during play. Anything
   that writes the field outside the sim loop — run generation, above all — has
   to recount, or the meter reports the previous run's number. */
function recountBloom() {
  let n = 0;
  for (let i = 0; i < World.bloom.length; i++) if (World.bloom[i] >= BLOOM_READ_THRESHOLD) n++;
  World.bloomedTiles = n;
}

/* ---------------------------------------------------------------------------
   How much of this plateau CAN be lit. Three beacons and the Boss Bloom cover
   roughly 42% of the map — the rest is out of reach of any light source in the
   run, by design. The meter marks this so a full clear doesn't read as a
   failure to finish something.
   --------------------------------------------------------------------------- */
function computeBloomCeiling() {
  const snapshot = World.target.slice();
  for (const f of flowers) paintBloom(f.wx, f.wy, CONFIG.FLOWER_BLOOM_RADIUS, 1.0);
  paintBloom(Boss.wx, Boss.wy, CONFIG.BOSS_BLOOM_RADIUS, 1.0);
  let n = 0;
  for (let i = 0; i < World.target.length; i++) if (World.target[i] >= BLOOM_READ_THRESHOLD) n++;
  World.ceiling = n / World.totalTiles;
  World.target.set(snapshot);
}

/* When the light fades, unbloomed ground goes to true black and starts biting. */
let duskReclaim = 0; // 0..1 visual progress of the dark rolling back in

/* ---- procedural placement helpers -------------------------------------------- */
function isOpenSpot(x, y, clearance) {
  const c = clearance || 1;
  for (let iy = Math.floor(y - c); iy <= Math.ceil(y + c); iy++) {
    for (let ix = Math.floor(x - c); ix <= Math.ceil(x + c); ix++) {
      if (!inMap(ix, iy)) return false;
      if (World.solid[tIdx(ix, iy)] === 1) return false;
    }
  }
  return true;
}

function findOpenSpot(opts) {
  const o = opts || {};
  const clearance = o.clearance || 1.6;
  const avoid = o.avoid || [];
  const minSep = o.minSep || 0;
  const margin = o.margin || 3;
  for (let tries = 0; tries < 500; tries++) {
    const relax = tries / 500;
    const x = rndR(margin, World.w - margin);
    const y = rndR(margin, World.h - margin);
    if (!isOpenSpot(x, y, clearance)) continue;
    if (o.minDistFrom && dist(x, y, o.minDistFrom[0], o.minDistFrom[1]) < o.minDistFrom[2] * (1 - relax * 0.5)) continue;
    if (o.maxDistFrom && dist(x, y, o.maxDistFrom[0], o.maxDistFrom[1]) > o.maxDistFrom[2] * (1 + relax * 0.5)) continue;
    let bad = false;
    for (const a of avoid) {
      if (dist(x, y, a[0], a[1]) < minSep * (1 - relax * 0.6)) { bad = true; break; }
    }
    if (bad) continue;
    if (o.test && !o.test(x, y, relax)) continue;
    return [x, y];
  }
  // last resort: any open tile
  for (let tries = 0; tries < 2000; tries++) {
    const x = rndR(margin, World.w - margin), y = rndR(margin, World.h - margin);
    if (isOpenSpot(x, y, 1.0)) return [x, y];
  }
  return [World.w / 2, World.h / 2];
}

/* perpendicular distance from point to the spawn->boss corridor */
function corridorOffset(px, py, ax, ay, bx, by) {
  const vx = bx - ax, vy = by - ay;
  const len2 = vx * vx + vy * vy;
  if (len2 < 1e-6) return dist(px, py, ax, ay);
  let t = ((px - ax) * vx + (py - ay) * vy) / len2;
  t = clamp(t, 0, 1);
  return dist(px, py, ax + vx * t, ay + vy * t);
}

/* ---- collision --------------------------------------------------------------- */
/* circle vs the solid tile field — resolves on each axis so you slide along walls */
function moveWithCollision(ent, dx, dy) {
  const r = ent.r;
  let nx = ent.wx + dx;
  if (!circleHitsSolid(nx, ent.wy, r)) ent.wx = nx;
  let ny = ent.wy + dy;
  if (!circleHitsSolid(ent.wx, ny, r)) ent.wy = ny;
  ent.wx = clamp(ent.wx, r, World.w - r);
  ent.wy = clamp(ent.wy, r, World.h - r);
}

function circleHitsSolid(cx, cy, r) {
  const x0 = Math.floor(cx - r), x1 = Math.floor(cx + r);
  const y0 = Math.floor(cy - r), y1 = Math.floor(cy + r);
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      if (!inMap(x, y)) return true;
      if (World.solid[tIdx(x, y)] !== 1) continue;
      const nxp = clamp(cx, x, x + 1), nyp = clamp(cy, y, y + 1);
      if (dist2(cx, cy, nxp, nyp) < r * r) return true;
    }
  }
  return false;
}

/* cheap line-of-sight for the spitter so it doesn't shoot through monoliths */
function hasLOS(ax, ay, bx, by) {
  const d = dist(ax, ay, bx, by);
  const steps = Math.ceil(d * 2);
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    if (isSolid(ax + (bx - ax) * t, ay + (by - ay) * t)) return false;
  }
  return true;
}

/* height of whatever occupies this tile, in sim units (0 when open) */
function solidHeightAt(wx, wy) {
  const x = Math.floor(wx), y = Math.floor(wy);
  if (!inMap(x, y)) return 0;
  return World.solidH ? World.solidH[tIdx(x, y)] : 0;
}

/* ============================================================================
   RUN GENERATION — everything randomized per session, from the seed
   ========================================================================== */
function generateRun(seed) {
  Game.seed = seed >>> 0;
  RNG = makeRng(Game.seed);

  worldInit();
  particles.length = 0; floaters.length = 0; cards.length = 0;
  enemies.length = 0; bolts.length = 0; enemyBolts.length = 0; pickups.length = 0;
  flowers = []; chests = [];
  duskReclaim = 0;

  /* spawn: a random edge-ish quadrant so the map doesn't feel memorized by position */
  const pad = 6;
  const corner = rndI(0, 3);
  const spawnX = (corner === 0 || corner === 3) ? rndR(pad, pad + 4) : rndR(World.w - pad - 4, World.w - pad);
  const spawnY = (corner === 0 || corner === 1) ? rndR(pad, pad + 4) : rndR(World.h - pad - 4, World.h - pad);

  generateStructures(spawnX, spawnY);

  Player.wx = spawnX; Player.wy = spawnY;
  Player.maxHp = CONFIG.PLAYER_MAX_HP; Player.hp = CONFIG.PLAYER_MAX_HP;
  Player.silver = 0; Player.totalSilver = 0;
  Player.items = []; Player.pierce = 0;
  Player.dmgMult = 1; Player.rateMult = 1; Player.speedMult = 1;
  Player.fireTimer = 0; Player.iframes = 0; Player.hurtFlash = 0; Player.firing = false;
  Player.vx = 0; Player.vy = 0; Player.aimX = 1; Player.aimY = 0;

  /* --- BOSS: far, reachable, no gate -------------------------------------- */
  const bpos = findOpenSpot({
    clearance: 3.2, margin: 5,
    minDistFrom: [spawnX, spawnY, CONFIG.BOSS_MIN_DIST_SPAWN],
  });
  Boss.wx = bpos[0]; Boss.wy = bpos[1];
  Boss.hp = CONFIG.BOSS_HP; Boss.maxHp = CONFIG.BOSS_HP;
  Boss.charge = 0; Boss.active = false; Boss.dead = false; Boss.deathAnim = 0;
  Boss.openness = 0; Boss.hitFlash = 0; Boss.enraged = false;
  Boss.barrageCd = 1.2; Boss.sweepCd = CONFIG.BOSS_SWEEP_COOLDOWN; Boss.seedCd = 4.0;
  Boss.sweepState = 0; Boss.sweepT = 0; Boss.sway = 0;
  Portal.exists = false; Portal.anim = 0; Portal.wx = Boss.wx; Portal.wy = Boss.wy;

  /* --- FLOWERS: guaranteed spread, healing kept near the corridor ---------- */
  /* FRAGILE #3 mitigation. Types are shuffled so which flower is where varies,
     but the HEAL flower is always placed within HEAL_CORRIDOR_MAX_OFFSET of the
     straight line from spawn to boss — an unlucky roll can't strand it. */
  const types = ['econ', 'heal', 'buff'];
  for (let i = types.length - 1; i > 0; i--) { const j = rndI(0, i); const t = types[i]; types[i] = types[j]; types[j] = t; }

  const placed = [];
  // heal first, constrained to the corridor
  const healPos = findOpenSpot({
    clearance: 2.4, margin: 4,
    minDistFrom: [spawnX, spawnY, CONFIG.FLOWER_MIN_DIST_SPAWN],
    test: (x, y, relax) =>
      corridorOffset(x, y, spawnX, spawnY, Boss.wx, Boss.wy) < CONFIG.HEAL_CORRIDOR_MAX_OFFSET * (1 + relax) &&
      dist(x, y, Boss.wx, Boss.wy) > CONFIG.BOSS_TRIGGER_RADIUS + 4,
  });
  flowers.push(makeFlower('heal', healPos[0], healPos[1]));
  placed.push(healPos);

  for (const t of types) {
    if (t === 'heal') continue;
    const p = findOpenSpot({
      clearance: 2.4, margin: 4, avoid: placed, minSep: CONFIG.FLOWER_MIN_SEPARATION,
      minDistFrom: [spawnX, spawnY, CONFIG.FLOWER_MIN_DIST_SPAWN],
      test: (x, y) => dist(x, y, Boss.wx, Boss.wy) > CONFIG.BOSS_TRIGGER_RADIUS + 4,
    });
    flowers.push(makeFlower(t, p[0], p[1]));
    placed.push(p);
  }

  /* --- CHESTS ------------------------------------------------------------- */
  const chestSpots = [];
  for (let i = 0; i < CONFIG.CHEST_COUNT; i++) {
    const p = findOpenSpot({
      clearance: 1.8, margin: 4,
      avoid: chestSpots.concat(placed), minSep: CONFIG.CHEST_MIN_SEPARATION,
      minDistFrom: [spawnX, spawnY, 8],
      test: (x, y) => dist(x, y, Boss.wx, Boss.wy) > CONFIG.BOSS_TRIGGER_RADIUS + 3,
    });
    chestSpots.push(p);
    chests.push(makeChest(p[0], p[1], CONFIG.CHEST_COST));
  }

  /* --- ENEMIES ------------------------------------------------------------
     The map starts nearly empty. Everything else arrives in waves (see the
     difficulty ramp in the simulation), so the opening is quiet enough to learn
     the controls in and no swarm is ever waiting at your feet. */
  const spawnEnemyAt = (kind) => {
    const p = findOpenSpot({
      clearance: 1.2, margin: 3,
      minDistFrom: [spawnX, spawnY, CONFIG.START_MIN_DIST_SPAWN],
    });
    enemies.push(makeEnemy(kind, p[0], p[1]));
  };
  for (let i = 0; i < CONFIG.START_RUSHERS; i++) spawnEnemyAt('rusher');
  for (let i = 0; i < CONFIG.START_SPITTERS; i++) spawnEnemyAt('spitter');

  /* a small honour guard around the boss so a cold rush is punished by design */
  for (let i = 0; i < CONFIG.BOSS_GUARD_COUNT; i++) {
    const a = rndR(0, TAU), d = rndR(4.5, 7.5);
    const x = clamp(Boss.wx + Math.cos(a) * d, 2, World.w - 2);
    const y = clamp(Boss.wy + Math.sin(a) * d, 2, World.h - 2);
    if (!circleHitsSolid(x, y, 0.6)) enemies.push(makeEnemy(i === 1 ? 'spitter' : 'rusher', x, y));
  }

  /* --- CLOCK -------------------------------------------------------------- */
  Game.time = 0;
  Game.timeLeft = CONFIG.LIGHT_SECONDS;
  Game.dusk = false; Game.duskTimer = 0; Game.clearTime = 0;
  respawnTimer = CONFIG.WAVE_FIRST_AT;

  /* the wilted beacon you spawn at: the last ember of it, and a real foothold */
  paintBloom(spawnX, spawnY, CONFIG.SPAWN_BLOOM_RADIUS, CONFIG.SPAWN_BLOOM_STRENGTH);
  for (let i = 0; i < World.bloom.length; i++) World.bloom[i] = World.target[i];
  recountBloom();
  computeBloomCeiling();
}

let respawnTimer = 0;

/* --- derived stats ------------------------------------------------------------ */
function flowerLit(id) {
  for (const f of flowers) if (f.type === id && f.bloomed) return true;
  return false;
}
function recomputeStats() {
  // items are permanent for the run: rebuilt from scratch, so this is idempotent
  const t = { dmgMult: 1, rateMult: 1, speedMult: 1, pierce: CONFIG.BOLT_PIERCE, maxHp: CONFIG.PLAYER_MAX_HP };
  for (const it of Player.items) it.apply(t);
  if (flowerLit('buff')) { t.dmgMult *= CONFIG.BUFF_DAMAGE_MULT; t.rateMult *= CONFIG.BUFF_FIRERATE_MULT; }
  Player.dmgMult  = t.dmgMult;
  Player.rateMult = t.rateMult;
  Player.speedMult = t.speedMult;
  Player.pierce   = t.pierce;
  Player.maxHp    = t.maxHp;
  Player.hp = Math.min(Player.hp, Player.maxHp);
}
/* ============================================================================
   SIMULATION
   ========================================================================== */

function updateGame(dt) {
  if (Game.state !== STATE.PLAY) return;

  /* --- clock ---------------------------------------------------------------
     The dark rolls in over the last DUSK_WINDOW_SECONDS, not after the buzzer.
     Unbloomed ground starts biting, bloomed ground holds — which is the payoff
     for every beacon you opened — and the run still ends at exactly 0:00. */
  Game.time += dt;
  Game.timeLeft = CONFIG.LIGHT_SECONDS - Game.time;

  const win = CONFIG.DUSK_WINDOW_SECONDS;
  if (!Game.dusk && win > 0 && Game.timeLeft <= win) {
    Game.dusk = true;
    addShake(12);
    Audio_.lose();
    floatText(Player.wx, Player.wy - 1.4, 'THE LIGHT IS GOING', PAL.blood, 20);
    showCard('THE LIGHT IS GOING', 'The dark is taking back everything you did not bloom',
             ['bloomed ground still holds', 'stand in it or burn'], PAL.blood, null, null);
  }
  if (Game.dusk) {
    duskReclaim = win > 0 ? clamp(1 - Game.timeLeft / win, 0, 1) : 1;
    Game.duskTimer = win - Math.max(0, Game.timeLeft);
    const onBloom = bloomAt(Player.wx, Player.wy) >= BLOOM_READ_THRESHOLD;
    /* ramped by duskReclaim so the last seconds tighten rather than slam */
    const dps = onBloom ? CONFIG.DUSK_BLOOMED_DPS : CONFIG.DUSK_DPS * duskReclaim;
    if (dps > 0) damagePlayer(dps * dt, true);
  }
  if (Game.timeLeft <= 0) { endRun(false); return; }

  updatePlayer(dt);
  updateFlowers(dt);
  updateChests(dt);
  updateEnemies(dt);
  updateBolts(dt);
  updateEnemyBolts(dt);
  updatePickups(dt);
  updateBoss(dt);
  updatePortal(dt);
  updateBloomField(dt);
  updateParticles(dt);
  updateFloaters(dt);
  updateCards(dt);
  updateRespawn(dt);
}

/* ============================================================================
   PLAYER
   ========================================================================== */
function updatePlayer(dt) {
  const p = Player;
  p.iframes = Math.max(0, p.iframes - dt);
  p.hurtFlash = Math.max(0, p.hurtFlash - dt * 3.2);

  /* movement — WASD, screen-relative so "W" is up the screen, not up the grid.
     Game.intent is the headless-playtest override; null in a real browser run. */
  let mx = 0, my = 0;
  if (Game.intent) {
    const n = normalize(Game.intent.mx, Game.intent.my);
    mx = n[0]; my = n[1];
  } else {
    let ix = 0, iy = 0;
    if (Input.key('w') || Input.key('arrowup'))    iy -= 1;
    if (Input.key('s') || Input.key('arrowdown'))  iy += 1;
    if (Input.key('a') || Input.key('arrowleft'))  ix -= 1;
    if (Input.key('d') || Input.key('arrowright')) ix += 1;
    const n = screenDirToWorld(ix, iy);
    mx = n[0]; my = n[1];
  }
  const speed = CONFIG.PLAYER_SPEED * p.speedMult;
  p.vx = mx * speed; p.vy = my * speed;
  if (mx || my) p.bob += dt * 11; else p.bob = approach(p.bob, 0, 6, dt);
  moveWithCollision(p, p.vx * dt, p.vy * dt);

  /* aim — mouse position projected back onto the ground plane */
  let ax, ay;
  if (Game.intent) {
    const n = normalize(Game.intent.ax, Game.intent.ay);
    ax = n[0]; ay = n[1];
  } else {
    const w = screenToWorld(Input.mx, Input.my);
    const n = normalize(w[0] - p.wx, w[1] - p.wy);
    ax = n[0]; ay = n[1];
  }
  if (ax || ay) { p.aimX = ax; p.aimY = ay; }
  p.facing = isoX(p.aimX, p.aimY) >= 0 ? 1 : -1;

  /* fire — only while the button is held. Nothing shoots on its own. */
  p.fireTimer -= dt;
  const cd = CONFIG.BOLT_COOLDOWN / p.rateMult;
  const wantsFire = Game.intent ? !!Game.intent.fire : Input.down;
  p.firing = wantsFire;
  if (wantsFire) {
    if (p.fireTimer <= 0) {
      p.fireTimer = cd;
      fireBolt(p.wx, p.wy, p.aimX, p.aimY);
    }
  } else {
    /* released: the next click fires immediately instead of waiting out a cooldown */
    if (p.fireTimer < 0) p.fireTimer = 0;
  }

  /* economy + regen from lit beacons */
  if (flowerLit('econ')) {
    econAccum += CONFIG.ECON_PASSIVE_PER_SEC * dt;
    while (econAccum >= 1) { econAccum -= 1; p.silver += 1; p.totalSilver += 1; }
  }
  if (flowerLit('heal') && p.hp < p.maxHp) {
    p.hp = Math.min(p.maxHp, p.hp + CONFIG.HEAL_REGEN_PER_SEC * dt);
  }
}
let econAccum = 0;

function fireBolt(wx, wy, dx, dy) {
  const off = CONFIG.BOLT_MUZZLE_OFFSET;
  bolts.push({
    wx: wx + dx * off, wy: wy + dy * off,
    vx: dx * CONFIG.BOLT_SPEED, vy: dy * CONFIG.BOLT_SPEED,
    life: CONFIG.BOLT_LIFE, dmg: CONFIG.BOLT_DAMAGE * Player.dmgMult,
    pierce: Player.pierce, hit: [], r: CONFIG.BOLT_RADIUS, spin: rndR(0, TAU),
  });
  Audio_.shoot();
}

function damagePlayer(amount, ignoreIframes) {
  const p = Player;
  if (!ignoreIframes) {
    if (p.iframes > 0) return;
    p.iframes = CONFIG.PLAYER_IFRAMES;
    addShake(CONFIG.SHAKE_HIT);
    Audio_.hurt();
    p.hurtFlash = 1;
    floatText(p.wx, p.wy - 1.0, '-' + Math.round(amount), PAL.blood, 15);
  }
  p.hp -= amount;
  if (p.hp <= 0) { p.hp = 0; endRun(false); }
}

/* ============================================================================
   BEACON FLOWERS — hold-radius / hold-timer capture
   ========================================================================== */
function updateFlowers(dt) {
  for (const f of flowers) {
    f.sway += dt * 1.3;
    if (f.bloomed) { f.bloomAnim = Math.min(1, f.bloomAnim + dt * 1.6); continue; }

    const d = dist(Player.wx, Player.wy, f.wx, f.wy);
    f.inRadius = d <= CONFIG.FLOWER_HOLD_RADIUS;

    if (f.inRadius) {
      f.progress += dt / CONFIG.FLOWER_HOLD_SECONDS;
      if (rnd() < dt * 22) {
        const a = rndR(0, TAU), rr = rndR(0.5, CONFIG.FLOWER_HOLD_RADIUS);
        spawnParticle(f.wx + Math.cos(a) * rr, f.wy + Math.sin(a) * rr,
          -Math.cos(a) * 2.4, -Math.sin(a) * 2.4, 0.55, 2.4, FLOWER_TYPES[f.type].petal);
      }
      if (f.progress >= 1) bloomFlower(f);
    } else {
      // FRAGILE #1: leaving the radius bleeds progress rather than hard-resetting.
      f.progress = Math.max(0, f.progress - CONFIG.FLOWER_DECAY_PER_SEC * dt);
    }
  }
}

function bloomFlower(f) {
  f.bloomed = true; f.progress = 1; f.bloomAnim = 0;
  paintBloom(f.wx, f.wy, CONFIG.FLOWER_BLOOM_RADIUS, 1.0);
  addShake(CONFIG.SHAKE_BLOOM);
  Audio_.bloom();
  const T = FLOWER_TYPES[f.type];
  showCard(T.name, T.tag, flowerLines(f.type), T.petal, null, f.type);
  floatText(f.wx, f.wy - 1.8, T.name + ' OPENS', T.petal, 18);
  burst(f.wx, f.wy, 46, { color: T.petal, smin: 3, smax: 12, lmin: 0.5, lmax: 1.2, zmax: 6 });
  burst(f.wx, f.wy, 18, { color: PAL.bloom, smin: 1, smax: 5, lmin: 0.8, lmax: 1.6 });
  if (f.type === 'heal') {
    Player.hp = Math.min(Player.maxHp, Player.hp + CONFIG.HEAL_INSTANT);
    floatText(Player.wx, Player.wy - 1.2, '+' + CONFIG.HEAL_INSTANT, FLOWER_TYPES.heal.core, 16);
  }
  recomputeStats();
}

/* ============================================================================
   CHESTS
   ========================================================================== */
function updateChests(dt) {
  for (const c of chests) {
    c.sway += dt;
    if (c.opened) { c.openAnim = Math.min(1, c.openAnim + dt * 2.2); continue; }
    const d = dist(Player.wx, Player.wy, c.wx, c.wy);
    c.near = d <= CONFIG.CHEST_INTERACT_RADIUS;
    const wants = Game.intent ? Game.intent.interact : Input.pressed('e');
    if (c.near && wants && Player.silver >= c.cost) openChest(c);
  }
}

let chestsOpened = 0;
function openChest(c) {
  Player.silver -= c.cost;
  c.opened = true; c.openAnim = 0;
  chestsOpened++;
  // raise the price of every unopened cache
  for (const o of chests) if (!o.opened) o.cost += CONFIG.CHEST_COST_ESCALATION;

  // draw an item the player doesn't already have, if possible
  const owned = new Set(Player.items.map(i => i.id));
  const avail = ITEM_POOL.filter(i => !owned.has(i.id));
  const item = avail.length ? rndPick(avail) : rndPick(ITEM_POOL);
  c.item = item;
  Player.items.push(item);
  recomputeStats();
  if (item.heal) Player.hp = Math.min(Player.maxHp, Player.hp + item.heal);

  Audio_.chest();
  addShake(7);
  showCard(item.name, item.desc, [item.stat], PAL.bloom, item.id, null);
  floatText(c.wx, c.wy - 1.6, item.name, PAL.bloom, 17);
  burst(c.wx, c.wy, 34, { color: '#E8D98B', smin: 2, smax: 9, lmin: 0.5, lmax: 1.1 });
}

/* ============================================================================
   ENEMIES
   ========================================================================== */
function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.t += dt; e.wob += dt;
    e.hitFlash = Math.max(0, e.hitFlash - dt * 5);
    e.touchCd = Math.max(0, e.touchCd - dt);
    e.spawnGrace = Math.max(0, e.spawnGrace - dt);

    const d = dist(e.wx, e.wy, Player.wx, Player.wy);
    const aggro = d < CONFIG.ENEMY_AGGRO_RANGE;
    const [tx, ty] = normalize(Player.wx - e.wx, Player.wy - e.wy);

    if (e.kind === 'rusher') {
      /* melee rusher: closes, plants for a visible beat, THEN lunges. The
         wind-up is what makes the lunge dodgeable instead of a teleport. */
      e.lungeCd -= dt;
      if (e.windup > 0) {
        e.windup -= dt;
        if (e.windup <= 0) { e.lunge = CONFIG.RUSHER_LUNGE_TIME; e.dirX = tx; e.dirY = ty; }
      } else if (e.lunge > 0) {
        e.lunge -= dt;
        moveWithCollision(e, e.dirX * e.speed * CONFIG.RUSHER_LUNGE_MULT * dt,
                             e.dirY * e.speed * CONFIG.RUSHER_LUNGE_MULT * dt);
        if (rnd() < dt * 14) spawnParticle(e.wx, e.wy, rndR(-1, 1), rndR(-1, 1), 0.3, 2, PAL.blood, true);
      } else if (aggro) {
        if (d < CONFIG.RUSHER_LUNGE_RANGE && e.lungeCd <= 0) {
          e.windup = CONFIG.RUSHER_LUNGE_TELEGRAPH;
          e.lungeCd = rndR(2.0, 3.2);
        } else {
          moveWithCollision(e, tx * e.speed * dt, ty * e.speed * dt);
        }
      } else {
        wander(e, dt, 0.45);
      }

    } else if (e.kind === 'spitter') {
      /* ranged: keeps its distance, only fires with line of sight */
      e.shotCd -= dt;
      if (aggro) {
        const want = CONFIG.SPITTER_KEEP_DIST;
        const push = d < want - 0.6 ? -1 : (d > want + 1.2 ? 1 : 0);
        const strafe = Math.sin(e.t * 1.1 + e.wob) * 0.55;
        moveWithCollision(e,
          (tx * push + -ty * strafe) * e.speed * dt,
          (ty * push +  tx * strafe) * e.speed * dt);
        if (e.shotCd <= 0 && d < CONFIG.SPITTER_RANGE && hasLOS(e.wx, e.wy, Player.wx, Player.wy)) {
          e.shotCd = CONFIG.SPITTER_SHOT_COOLDOWN;
          enemyBolts.push({
            wx: e.wx, wy: e.wy,
            vx: tx * CONFIG.SPITTER_SHOT_SPEED, vy: ty * CONFIG.SPITTER_SHOT_SPEED,
            life: 2.4, dmg: CONFIG.SPITTER_SHOT_DAMAGE, r: 0.34, spin: 0, kind: 'spit',
          });
          Audio_.blip(300, 0.09, 'sawtooth', 0.05, 0.6);
        }
      } else {
        wander(e, dt, 0.3);
      }

    } else { /* mite — swarm: circles at a standoff, darts in, then peels away.
                It must never park on top of the player: at point-blank it is
                behind the muzzle and effectively unhittable. */
      e.orbit += dt * e.orbitDir * 2.0;
      e.dartCd -= dt;
      if (e.retreat > 0) {
        e.retreat -= dt;
        const sp = e.speed * CONFIG.MITE_RETREAT_MULT;
        const jx = Math.cos(e.orbit) * 0.5, jy = Math.sin(e.orbit) * 0.5;
        const [ux, uy] = normalize(-tx + jx, -ty + jy);
        moveWithCollision(e, ux * sp * dt, uy * sp * dt);
      } else if (e.darting > 0) {
        e.darting -= dt;
        moveWithCollision(e, tx * e.speed * 1.35 * dt, ty * e.speed * 1.35 * dt);
      } else if (aggro) {
        const stand = CONFIG.MITE_STANDOFF + Player.r;
        if (d < stand + 0.6 && e.dartCd <= 0) {
          e.darting = 0.45; e.dartCd = CONFIG.MITE_DART_COOLDOWN;
        } else {
          /* hold the ring: close only to the standoff, and strafe around it */
          const radial = d > stand + 0.3 ? 1 : (d < stand - 0.3 ? -1 : 0);
          const strafe = Math.sin(e.orbit) * CONFIG.MITE_ORBIT_JITTER * 0.4 + e.orbitDir * 0.7;
          const [ux, uy] = normalize(tx * radial + -ty * strafe, ty * radial + tx * strafe);
          moveWithCollision(e, ux * e.speed * dt, uy * e.speed * dt);
        }
      } else {
        wander(e, dt, 0.6);
      }
    }

    /* contact damage */
    const touchR = e.r + Player.r;
    if (d < touchR && e.touchCd <= 0 && e.spawnGrace <= 0) {
      e.touchCd = 0.6;
      const dmg = e.kind === 'rusher' ? CONFIG.RUSHER_DAMAGE : e.kind === 'mite' ? CONFIG.MITE_DAMAGE : 8;
      damagePlayer(dmg, false);
      if (e.kind === 'rusher') e.lunge = 0;
      /* it landed its hit — now get off the player so it can be shot */
      if (e.kind === 'mite') { e.darting = 0; e.retreat = CONFIG.MITE_RETREAT_TIME; }
    }

    if (e.dead) enemies.splice(i, 1);
  }
}

function wander(e, dt, scale) {
  const a = e.wob * 0.7 + e.t * 0.3;
  moveWithCollision(e, Math.cos(a) * e.speed * scale * dt, Math.sin(a) * e.speed * scale * dt);
}

function killEnemy(e, idx) {
  e.dead = true;
  Audio_.kill();
  addHitstop(CONFIG.HITSTOP_ON_KILL);
  const base = e.kind === 'rusher' ? CONFIG.RUSHER_DROP : e.kind === 'spitter' ? CONFIG.SPITTER_DROP : CONFIG.MITE_DROP;
  const mult = flowerLit('econ') ? CONFIG.ECON_DROP_MULT : 1;
  const n = Math.max(1, Math.round(base * mult));
  for (let i = 0; i < n; i++) pickups.push(makePickup(e.wx, e.wy, 1));
  burst(e.wx, e.wy, e.kind === 'mite' ? 6 : 16, { color: PAL.blood, smin: 2, smax: 7, lmin: 0.2, lmax: 0.5 });
  burst(e.wx, e.wy, 4, { color: PAL.bloom, smin: 1, smax: 4, lmin: 0.4, lmax: 0.8 });
  if (idx !== undefined) enemies.splice(idx, 1);
}

/* ============================================================================
   DIFFICULTY RAMP — waves, not a map that starts full
   The run opens with a handful of rushers out in the dark. Waves begin after
   WAVE_FIRST_AT, grow in size, arrive more often, and unlock enemy kinds on a
   clock so the player meets one new thing at a time.
   ========================================================================== */
function waveInterval(t) {
  return Math.max(CONFIG.WAVE_INTERVAL_MIN,
                  CONFIG.WAVE_INTERVAL - t * CONFIG.WAVE_INTERVAL_DECAY);
}
function waveSize(t) {
  return Math.min(CONFIG.WAVE_SIZE_MAX,
                  Math.round(CONFIG.WAVE_SIZE_BASE + t * CONFIG.WAVE_SIZE_PER_SEC));
}
function enemyCap(t) {
  return Math.min(CONFIG.ENEMY_CAP_MAX,
                  Math.round(CONFIG.ENEMY_CAP_BASE + t * CONFIG.ENEMY_CAP_PER_SEC));
}
function unlockedKinds(t) {
  const k = ['rusher'];
  if (t >= CONFIG.SPITTER_UNLOCK_AT) k.push('spitter');
  if (t >= CONFIG.MITE_UNLOCK_AT) k.push('mite');
  return k;
}

function spawnWave() {
  const t = Game.time;
  const cap = enemyCap(t);
  let budget = Math.min(waveSize(t), Math.max(0, cap - enemies.length));
  if (budget <= 0) return;

  const kinds = unlockedKinds(t);
  while (budget > 0) {
    const kind = rndPick(kinds);
    const spot = findOpenSpot({
      clearance: 1.2, margin: 3,
      minDistFrom: [Player.wx, Player.wy, CONFIG.SPAWN_MIN_DIST_PLAYER],
      maxDistFrom: [Player.wx, Player.wy, CONFIG.SPAWN_MAX_DIST_PLAYER],
    });
    if (kind === 'mite') {
      /* mites only ever arrive as a small cluster — one alone reads as noise */
      const n = Math.min(budget, CONFIG.MITE_PER_CLUSTER);
      for (let i = 0; i < n; i++) {
        const a = rndR(0, TAU), r = rndR(0.5, 2.0);
        const x = clamp(spot[0] + Math.cos(a) * r, 1.5, World.w - 1.5);
        const y = clamp(spot[1] + Math.sin(a) * r, 1.5, World.h - 1.5);
        if (circleHitsSolid(x, y, CONFIG.MITE_RADIUS)) continue;
        enemies.push(makeEnemy('mite', x, y));
      }
      budget -= n;
    } else {
      enemies.push(makeEnemy(kind, spot[0], spot[1]));
      budget -= 1;
    }
  }
}

function updateRespawn(dt) {
  if (Game.dusk) return;
  respawnTimer -= dt;
  if (respawnTimer > 0) return;
  respawnTimer = waveInterval(Game.time);
  spawnWave();
}

/* ============================================================================
   PROJECTILES
   ========================================================================== */
/* Bolts move ~0.4 tiles per frame — further than a mite is wide. Stepping the
   whole distance at once let small, close enemies pass straight through the
   bolt between frames, which is why a swarm sitting on you felt unkillable.
   Each bolt now walks its travel in sub-steps and tests collision at each. */
function updateBolts(dt) {
  for (let i = bolts.length - 1; i >= 0; i--) {
    const b = bolts[i];
    b.life -= dt; b.spin += dt * 18;
    if (b.life <= 0) { bolts.splice(i, 1); continue; }

    const travel = Math.hypot(b.vx, b.vy) * dt;
    const steps = Math.max(1, Math.ceil(travel / CONFIG.BOLT_STEP_MAX));
    const sdt = dt / steps;
    let dead = false;

    for (let s = 0; s < steps && !dead; s++) {
      b.wx += b.vx * sdt; b.wy += b.vy * sdt;

      if (isSolid(b.wx, b.wy)) {
        burst(b.wx, b.wy, 4, { color: PAL.bloom, smin: 1, smax: 3, lmin: 0.1, lmax: 0.3 });
        dead = true; break;
      }

      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (b.hit.indexOf(e) >= 0) continue;
        const rr = b.r + e.r;
        if (dist2(b.wx, b.wy, e.wx, e.wy) < rr * rr) {
          e.hp -= b.dmg; e.hitFlash = 1;
          if (e.kind === 'mite') { e.retreat = CONFIG.MITE_RETREAT_TIME; }
          Audio_.hit();
          burst(b.wx, b.wy, 5, { color: PAL.bone, smin: 2, smax: 6, lmin: 0.1, lmax: 0.3 });
          if (e.hp <= 0) killEnemy(e, j);
          b.hit.push(e);
          if (b.pierce > 0) b.pierce--; else dead = true;
          break;
        }
      }
      if (dead) break;

      /* boss — only takes damage once it has been forced awake */
      if (!Boss.dead && Boss.active) {
        const rr = b.r + Boss.r;
        if (dist2(b.wx, b.wy, Boss.wx, Boss.wy) < rr * rr) {
          damageBoss(b.dmg, b.wx, b.wy);
          dead = true; break;
        }
      }
    }

    if (dead) { bolts.splice(i, 1); continue; }
    if (rnd() < dt * 30) spawnParticle(b.wx, b.wy, rndR(-.6, .6), rndR(-.6, .6), 0.22, 1.8, PAL.bloom);
  }
}

function updateEnemyBolts(dt) {
  for (let i = enemyBolts.length - 1; i >= 0; i--) {
    const b = enemyBolts[i];
    b.life -= dt; b.spin += dt * 9;
    if (b.life <= 0) { enemyBolts.splice(i, 1); continue; }
    b.wx += b.vx * dt; b.wy += b.vy * dt;
    if (isSolid(b.wx, b.wy)) { enemyBolts.splice(i, 1); continue; }
    if (b.kind === 'petal' && rnd() < dt * 18) {
      spawnParticle(b.wx, b.wy, 0, 0, 0.28, 2.0, PAL.accent);
    }
    if (dist2(b.wx, b.wy, Player.wx, Player.wy) < (b.r + Player.r) * (b.r + Player.r)) {
      damagePlayer(b.dmg, false);
      burst(b.wx, b.wy, 6, { color: b.kind === 'petal' ? PAL.accent : PAL.blood, smin: 2, smax: 6, lmin: 0.15, lmax: 0.35 });
      enemyBolts.splice(i, 1);
    }
  }
}

function updatePickups(dt) {
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.life -= dt; p.spin += dt * 3;
    if (p.life <= 0) { pickups.splice(i, 1); continue; }
    const d = dist(p.wx, p.wy, Player.wx, Player.wy);
    if (d < 3.4) {
      const [ux, uy] = normalize(Player.wx - p.wx, Player.wy - p.wy);
      const pull = 13 * (1 - d / 3.4) + 3;
      p.vx = lerp(p.vx, ux * pull, 0.24); p.vy = lerp(p.vy, uy * pull, 0.24);
      p.pulled = true;
    } else {
      p.vx *= Math.pow(0.06, dt); p.vy *= Math.pow(0.06, dt);
    }
    p.wx += p.vx * dt; p.wy += p.vy * dt;
    if (d < 0.7) {
      Player.silver += p.value; Player.totalSilver += p.value;
      Audio_.coin();
      spawnParticle(p.wx, p.wy, 0, -2, 0.35, 2.4, '#E8D98B');
      pickups.splice(i, 1);
    }
  }
}

/* ============================================================================
   BOSS BLOOM
   ========================================================================== */
function updateBoss(dt) {
  const B = Boss;
  B.sway += dt;
  B.hitFlash = Math.max(0, B.hitFlash - dt * 4);

  if (B.dead) { B.deathAnim = Math.min(1, B.deathAnim + dt * 0.7); return; }

  const d = dist(Player.wx, Player.wy, B.wx, B.wy);

  /* --- activation charge-up: cannot be triggered by walking past ---------- */
  if (!B.active) {
    if (d <= CONFIG.BOSS_TRIGGER_RADIUS) {
      const was = B.charge;
      B.charge = Math.min(1, B.charge + dt / CONFIG.BOSS_CHARGE_SECONDS);
      if (was < 0.02 && B.charge >= 0.02) Audio_.charge();
      if (rnd() < dt * 26) {
        const a = rndR(0, TAU), rr = rndR(1, CONFIG.BOSS_TRIGGER_RADIUS);
        spawnParticle(B.wx + Math.cos(a) * rr, B.wy + Math.sin(a) * rr,
          -Math.cos(a) * 3.2, -Math.sin(a) * 3.2, 0.5, 2.6, PAL.accent);
      }
      if (B.charge >= 1) {
        B.active = true;
        addShake(16);
        Audio_.blip(120, 0.9, 'sawtooth', 0.18, 5.0);
        floatText(B.wx, B.wy - 3.2, 'THE BOSS BLOOM WAKES', PAL.accent, 20);
        burst(B.wx, B.wy, 40, { color: PAL.accent, smin: 4, smax: 13, lmin: 0.5, lmax: 1.1 });
      }
    } else {
      B.charge = Math.max(0, B.charge - CONFIG.BOSS_CHARGE_DECAY * dt / CONFIG.BOSS_CHARGE_SECONDS);
    }
    B.openness = approach(B.openness, B.charge * 0.35, 5, dt);
    return;
  }

  B.openness = approach(B.openness, 1, 3.2, dt);
  const frac = B.hp / B.maxHp;
  if (!B.enraged && frac <= CONFIG.BOSS_ENRAGE_AT) {
    B.enraged = true;
    addShake(12);
    floatText(B.wx, B.wy - 3.0, 'IT REFUSES TO WILT', PAL.accent, 18);
  }
  const cdMult = B.enraged ? CONFIG.BOSS_ENRAGE_MULT : 1;

  /* contact */
  if (d < B.r + Player.r + 0.2) damagePlayer(CONFIG.BOSS_CONTACT_DAMAGE, false);

  /* --- attack: radial petal barrage -------------------------------------- */
  B.barrageCd -= dt;
  if (B.barrageCd <= 0) {
    B.barrageCd = CONFIG.BOSS_BARRAGE_COOLDOWN * cdMult;
    const n = CONFIG.BOSS_BARRAGE_PETALS + (B.enraged ? 4 : 0);
    const off = rndR(0, TAU);
    for (let i = 0; i < n; i++) {
      const a = off + (i / n) * TAU;
      enemyBolts.push({
        wx: B.wx + Math.cos(a) * B.r, wy: B.wy + Math.sin(a) * B.r,
        vx: Math.cos(a) * CONFIG.BOSS_BARRAGE_SPEED, vy: Math.sin(a) * CONFIG.BOSS_BARRAGE_SPEED,
        life: 3.0, dmg: CONFIG.BOSS_BARRAGE_DAMAGE, r: 0.38, spin: a, kind: 'petal',
      });
    }
    Audio_.blip(420, 0.22, 'sine', 0.08, 0.5);
    burst(B.wx, B.wy, 12, { color: PAL.accent, smin: 3, smax: 8, lmin: 0.2, lmax: 0.5 });
  }

  /* --- attack: rotating light-lash --------------------------------------- */
  B.sweepCd -= dt;
  if (B.sweepState === 0 && B.sweepCd <= 0) {
    B.sweepState = 1; B.sweepT = 0;
    B.sweepAngle = Math.atan2(Player.wy - B.wy, Player.wx - B.wx) - CONFIG.BOSS_SWEEP_ARC * 2;
    B.sweepDir = rndSign();
    Audio_.blip(200, 0.7, 'sawtooth', 0.07, 2.4);
  }
  if (B.sweepState === 1) {
    B.sweepT += dt;
    if (B.sweepT >= CONFIG.BOSS_SWEEP_WINDUP) { B.sweepState = 2; B.sweepT = 0; }
  } else if (B.sweepState === 2) {
    B.sweepT += dt;
    B.sweepAngle += B.sweepDir * (TAU * 0.55) * dt;
    const dp = dist(Player.wx, Player.wy, B.wx, B.wy);
    if (dp < CONFIG.BOSS_SWEEP_LENGTH) {
      let pa = Math.atan2(Player.wy - B.wy, Player.wx - B.wx);
      let da = Math.atan2(Math.sin(pa - B.sweepAngle), Math.cos(pa - B.sweepAngle));
      if (Math.abs(da) < CONFIG.BOSS_SWEEP_ARC * 0.5) damagePlayer(CONFIG.BOSS_SWEEP_DAMAGE, false);
    }
    if (B.sweepT >= CONFIG.BOSS_SWEEP_DURATION) {
      B.sweepState = 0; B.sweepCd = CONFIG.BOSS_SWEEP_COOLDOWN * cdMult;
    }
  }

  /* --- attack: spit seed-mites -------------------------------------------- */
  B.seedCd -= dt;
  if (B.seedCd <= 0) {
    B.seedCd = CONFIG.BOSS_SEED_COOLDOWN * cdMult;
    for (let i = 0; i < CONFIG.BOSS_SEED_COUNT; i++) {
      const a = rndR(0, TAU), r = rndR(2.2, 3.6);
      const x = clamp(B.wx + Math.cos(a) * r, 1.5, World.w - 1.5);
      const y = clamp(B.wy + Math.sin(a) * r, 1.5, World.h - 1.5);
      if (circleHitsSolid(x, y, CONFIG.MITE_RADIUS)) continue;
      enemies.push(makeEnemy('mite', x, y));
      burst(x, y, 6, { color: PAL.accent, smin: 2, smax: 5, lmin: 0.2, lmax: 0.4 });
    }
  }
}

function damageBoss(dmg, hx, hy) {
  const B = Boss;
  B.hp -= dmg; B.hitFlash = 1;
  Audio_.bossHurt();
  burst(hx, hy, 5, { color: PAL.accent, smin: 2, smax: 6, lmin: 0.1, lmax: 0.3 });
  if (B.hp <= 0) killBoss();
}

function killBoss() {
  const B = Boss;
  B.hp = 0; B.dead = true; B.deathAnim = 0;
  addShake(CONFIG.SHAKE_BOSS_DEATH);
  addHitstop(0.20);
  Audio_.bossDie();
  floatText(B.wx, B.wy - 3.4, 'IT BLOOMS', PAL.accent, 26);
  burst(B.wx, B.wy, 90, { color: PAL.accent, smin: 4, smax: 18, lmin: 0.7, lmax: 1.8, zmax: 9 });
  burst(B.wx, B.wy, 60, { color: PAL.bloom, smin: 2, smax: 12, lmin: 0.9, lmax: 2.2, zmax: 7 });
  /* the boss's own light floods the ground it was strangling */
  paintBloom(B.wx, B.wy, CONFIG.BOSS_BLOOM_RADIUS, 1.0);
  /* the portal does not fade in — it blooms into existence */
  Portal.exists = true; Portal.anim = 0;
  Portal.wx = B.wx; Portal.wy = B.wy;
  setTimeout(() => Audio_.portal(), 400);
}

function updatePortal(dt) {
  if (!Portal.exists) return;
  Portal.anim = Math.min(1, Portal.anim + dt / CONFIG.PORTAL_BLOOM_SECONDS);
  if (rnd() < dt * 30) {
    const a = rndR(0, TAU), r = rndR(0.4, CONFIG.PORTAL_RADIUS * 1.3);
    spawnParticle(Portal.wx + Math.cos(a) * r, Portal.wy + Math.sin(a) * r,
      -Math.cos(a) * 1.6, -Math.sin(a) * 1.6, 0.8, 2.6, rnd() < 0.5 ? PAL.accent : PAL.bloom);
  }
  if (Portal.anim >= 1 && dist(Player.wx, Player.wy, Portal.wx, Portal.wy) < CONFIG.PORTAL_RADIUS) {
    endRun(true);
  }
}

/* ============================================================================
   RUN END
   ========================================================================== */
function endRun(won) {
  if (Game.state !== STATE.PLAY) return;
  Game.clearTime = Game.time;
  /* why the run ended — the end card should teach, not just announce */
  if (!won) {
    const nearBoss = dist(Player.wx, Player.wy, Boss.wx, Boss.wy) < CONFIG.BOSS_TRIGGER_RADIUS + 3;
    const lit = flowers.filter(f => f.bloomed).length;
    if (Game.dusk)                       Game.deathContext = 'dusk';
    else if (Boss.dead)                  Game.deathContext = 'afterBoss';
    else if (Boss.active)                Game.deathContext = 'bossFight';
    else if (nearBoss || Boss.charge > 0) Game.deathContext = 'charge';
    else if (lit === 0)                  Game.deathContext = 'cold';
    else                                 Game.deathContext = 'route';
  }
  Game.state = won ? STATE.WIN : STATE.LOSE;
  Game.runs++;
  if (won) {
    Audio_.win();
    addShake(18);
    if (Game.best === null || Game.clearTime < Game.best) Game.best = Game.clearTime;
  } else if (!Game.dusk) {
    Audio_.lose();
  }
}
/* ============================================================================
   DUSKPETAL 3D — matrix maths and a thin WebGL2 layer

   No Three.js, no CDN, no build step. The whole renderer is in this file and
   the three that follow, so duskpetal3d.html stays a single file that opens
   from disk with no network at all.
   ========================================================================== */

/* --- mat4, column-major to match WebGL -------------------------------------- */
function m4() { return new Float32Array(16); }
function m4identity(o) {
  o[0]=1;o[1]=0;o[2]=0;o[3]=0; o[4]=0;o[5]=1;o[6]=0;o[7]=0;
  o[8]=0;o[9]=0;o[10]=1;o[11]=0; o[12]=0;o[13]=0;o[14]=0;o[15]=1; return o;
}
function m4mul(o, a, b) {
  const a00=a[0],a01=a[1],a02=a[2],a03=a[3], a10=a[4],a11=a[5],a12=a[6],a13=a[7],
        a20=a[8],a21=a[9],a22=a[10],a23=a[11], a30=a[12],a31=a[13],a32=a[14],a33=a[15];
  for (let i = 0; i < 4; i++) {
    const b0=b[i*4],b1=b[i*4+1],b2=b[i*4+2],b3=b[i*4+3];
    o[i*4]   = b0*a00 + b1*a10 + b2*a20 + b3*a30;
    o[i*4+1] = b0*a01 + b1*a11 + b2*a21 + b3*a31;
    o[i*4+2] = b0*a02 + b1*a12 + b2*a22 + b3*a32;
    o[i*4+3] = b0*a03 + b1*a13 + b2*a23 + b3*a33;
  }
  return o;
}
function m4perspective(o, fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
  o[0]=f/aspect;o[1]=0;o[2]=0;o[3]=0;
  o[4]=0;o[5]=f;o[6]=0;o[7]=0;
  o[8]=0;o[9]=0;o[10]=(far+near)*nf;o[11]=-1;
  o[12]=0;o[13]=0;o[14]=2*far*near*nf;o[15]=0;
  return o;
}
function m4lookAt(o, ex, ey, ez, cx, cy, cz, ux, uy, uz) {
  let zx = ex-cx, zy = ey-cy, zz = ez-cz;
  let l = Math.hypot(zx,zy,zz) || 1; zx/=l; zy/=l; zz/=l;
  let xx = uy*zz - uz*zy, xy = uz*zx - ux*zz, xz = ux*zy - uy*zx;
  l = Math.hypot(xx,xy,xz) || 1; xx/=l; xy/=l; xz/=l;
  const yx = zy*xz - zz*xy, yy = zz*xx - zx*xz, yz = zx*xy - zy*xx;
  o[0]=xx;o[1]=yx;o[2]=zx;o[3]=0;
  o[4]=xy;o[5]=yy;o[6]=zy;o[7]=0;
  o[8]=xz;o[9]=yz;o[10]=zz;o[11]=0;
  o[12]=-(xx*ex+xy*ey+xz*ez);
  o[13]=-(yx*ex+yy*ey+yz*ez);
  o[14]=-(zx*ex+zy*ey+zz*ez);
  o[15]=1;
  return o;
}
/* translate * rotateY * rotateX * rotateZ * scale — enough for every prop here */
function m4trs(o, px, py, pz, ry, rx, rz, sx, sy, sz) {
  const cy=Math.cos(ry), sy_=Math.sin(ry);
  const cx=Math.cos(rx), sxr=Math.sin(rx);
  const cz=Math.cos(rz), szr=Math.sin(rz);
  /* R = Ry * Rx * Rz */
  const r00 = cy*cz + sy_*sxr*szr, r01 = -cy*szr + sy_*sxr*cz, r02 = sy_*cx;
  const r10 = cx*szr,              r11 = cx*cz,                r12 = -sxr;
  const r20 = -sy_*cz + cy*sxr*szr,r21 = sy_*szr + cy*sxr*cz,  r22 = cy*cx;
  o[0]=r00*sx; o[1]=r10*sx; o[2]=r20*sx; o[3]=0;
  o[4]=r01*sy; o[5]=r11*sy; o[6]=r21*sy; o[7]=0;
  o[8]=r02*sz; o[9]=r12*sz; o[10]=r22*sz; o[11]=0;
  o[12]=px; o[13]=py; o[14]=pz; o[15]=1;
  return o;
}
function m4project(m, x, y, z) {
  const w = m[3]*x + m[7]*y + m[11]*z + m[15];
  return [
    (m[0]*x + m[4]*y + m[8]*z + m[12]) / w,
    (m[1]*x + m[5]*y + m[9]*z + m[13]) / w,
    (m[2]*x + m[6]*y + m[10]*z + m[14]) / w,
    w,
  ];
}

/* --- GL helpers -------------------------------------------------------------- */
let gl = null;

function glCompile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    throw new Error('shader: ' + gl.getShaderInfoLog(s) + '\n' + src);
  }
  return s;
}
function glProgram(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, glCompile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, glCompile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    throw new Error('link: ' + gl.getProgramInfoLog(p));
  }
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    const name = info.name.replace(/\[0\]$/, '');
    u[name] = gl.getUniformLocation(p, name);
  }
  return { prog: p, u };
}

/* Per-instance layout: mat4 (16) + colour (3) + emissive (3) = 22 floats. */
const INSTANCE_FLOATS = 22;

/* A drawable: one static geometry drawn many times with per-instance data. */
function makeBatch(geo) {
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);

  const vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, geo.verts, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);                                   // aPos
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 24, 0);
  gl.enableVertexAttribArray(1);                                   // aNormal
  gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 24, 12);

  const ibo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, ibo);
  const stride = INSTANCE_FLOATS * 4;
  for (let i = 0; i < 4; i++) {                                    // iMat columns
    gl.enableVertexAttribArray(2 + i);
    gl.vertexAttribPointer(2 + i, 4, gl.FLOAT, false, stride, i * 16);
    gl.vertexAttribDivisor(2 + i, 1);
  }
  gl.enableVertexAttribArray(6);                                   // iColor
  gl.vertexAttribPointer(6, 3, gl.FLOAT, false, stride, 64);
  gl.vertexAttribDivisor(6, 1);
  gl.enableVertexAttribArray(7);                                   // iEmissive
  gl.vertexAttribPointer(7, 3, gl.FLOAT, false, stride, 76);
  gl.vertexAttribDivisor(7, 1);

  gl.bindVertexArray(null);
  return {
    vao, vbo, ibo, count: geo.count,
    data: new Float32Array(INSTANCE_FLOATS * 64),
    n: 0,
    capacity: 64,
  };
}

function batchReset(b) { b.n = 0; }

/* push one instance; grows the CPU-side buffer as needed */
function batchPush(b, mat, cr, cg, cb, er, eg, eb) {
  if (b.n >= b.capacity) {
    b.capacity *= 2;
    const nd = new Float32Array(INSTANCE_FLOATS * b.capacity);
    nd.set(b.data);
    b.data = nd;
  }
  const o = b.n * INSTANCE_FLOATS;
  b.data.set(mat, o);
  b.data[o+16]=cr; b.data[o+17]=cg; b.data[o+18]=cb;
  b.data[o+19]=er; b.data[o+20]=eg; b.data[o+21]=eb;
  b.n++;
}

function batchDraw(b) {
  if (b.n === 0) return;
  gl.bindVertexArray(b.vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, b.ibo);
  gl.bufferData(gl.ARRAY_BUFFER, b.data.subarray(0, b.n * INSTANCE_FLOATS), gl.DYNAMIC_DRAW);
  gl.drawArraysInstanced(gl.TRIANGLES, 0, b.count, b.n);
  gl.bindVertexArray(null);
}
/* ============================================================================
   GEOMETRY — every mesh generated in code. No assets, no loaders.
   Each returns { verts: Float32Array(pos3 + normal3 interleaved), count }.
   ========================================================================== */

function geoFromTris(tris) {
  const verts = new Float32Array(tris.length * 6);
  for (let i = 0; i < tris.length; i++) {
    const t = tris[i];
    verts.set(t, i * 6);
  }
  return { verts, count: tris.length };
}

/* push a triangle with a computed flat normal — flat shading suits the
   stylized/graphic art direction far better than smooth normals */
function pushTri(out, ax, ay, az, bx, by, bz, cx, cy, cz) {
  const ux = bx-ax, uy = by-ay, uz = bz-az;
  const vx = cx-ax, vy = cy-ay, vz = cz-az;
  let nx = uy*vz - uz*vy, ny = uz*vx - ux*vz, nz = ux*vy - uy*vx;
  const l = Math.hypot(nx, ny, nz) || 1; nx/=l; ny/=l; nz/=l;
  out.push([ax,ay,az,nx,ny,nz], [bx,by,bz,nx,ny,nz], [cx,cy,cz,nx,ny,nz]);
}
function pushQuad(out, a, b, c, d) {
  pushTri(out, a[0],a[1],a[2], b[0],b[1],b[2], c[0],c[1],c[2]);
  pushTri(out, a[0],a[1],a[2], c[0],c[1],c[2], d[0],d[1],d[2]);
}

/* unit box, centred on X/Z, sitting on Y=0 (so scaling grows it upward) */
function geoBox() {
  const t = [];
  const h = 0.5;
  const p = [
    [-h,0,-h],[h,0,-h],[h,0,h],[-h,0,h],
    [-h,1,-h],[h,1,-h],[h,1,h],[-h,1,h],
  ];
  pushQuad(t, p[4],p[5],p[6],p[7]);            // top
  pushQuad(t, p[3],p[2],p[1],p[0]);            // bottom
  pushQuad(t, p[0],p[1],p[5],p[4]);            // -z
  pushQuad(t, p[2],p[3],p[7],p[6]);            // +z
  pushQuad(t, p[1],p[2],p[6],p[5]);            // +x
  pushQuad(t, p[3],p[0],p[4],p[7]);            // -x
  return geoFromTris(t);
}

/* cylinder of radius 0.5 from Y=0 to Y=1 */
function geoCylinder(seg) {
  const t = [], n = seg || 10, r = 0.5;
  for (let i = 0; i < n; i++) {
    const a0 = (i/n)*TAU, a1 = ((i+1)/n)*TAU;
    const x0=Math.cos(a0)*r, z0=Math.sin(a0)*r, x1=Math.cos(a1)*r, z1=Math.sin(a1)*r;
    pushQuad(t, [x0,0,z0],[x1,0,z1],[x1,1,z1],[x0,1,z0]);
    pushTri(t, 0,1,0, x0,1,z0, x1,1,z1);
    pushTri(t, 0,0,0, x1,0,z1, x0,0,z0);
  }
  return geoFromTris(t);
}

/* cone, base radius 0.5 at Y=0, apex at Y=1 */
function geoCone(seg) {
  const t = [], n = seg || 8, r = 0.5;
  for (let i = 0; i < n; i++) {
    const a0 = (i/n)*TAU, a1 = ((i+1)/n)*TAU;
    const x0=Math.cos(a0)*r, z0=Math.sin(a0)*r, x1=Math.cos(a1)*r, z1=Math.sin(a1)*r;
    pushTri(t, x0,0,z0, x1,0,z1, 0,1,0);
    pushTri(t, 0,0,0, x1,0,z1, x0,0,z0);
  }
  return geoFromTris(t);
}

/* low-poly sphere (octahedron subdivided) — faceted on purpose */
function geoSphere(sub) {
  const s = sub === undefined ? 2 : sub;
  let faces = [
